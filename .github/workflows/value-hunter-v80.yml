name: VALUE HUNTER bank 3Q26 public safety v80
on:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/bank_q3_publish_v80.py'
      - 'SGX_PDF_connection_probe/test_bank_q3_publish_v80.py'
      - '.github/workflows/value-hunter-v80.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Test bank periods, provenance, and investment ranking isolation
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_bank_q3_financials_v79.py test_bank_q3_publish_v80.py
