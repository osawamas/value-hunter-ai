name: VALUE HUNTER SGX live cross-document audit v27
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF parser
        run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Run tests
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_value_hunter_v27.py
      - name: Extract financials
        env:
          SGX_V18_OUTPUT: ${{ github.workspace }}/sgx_v18_results
        run: python SGX_PDF_connection_probe/sgx_integrated_v18.py
      - name: Integrate financials
        run: python SGX_PDF_connection_probe/value_hunter_v19.py --v18-dir sgx_v18_results --s68 SGX_PDF_connection_probe/fixtures/S68_FY2026_integrated_v14.json --output value_hunter_results
      - name: Audit against live second issuer PDFs
        run: python SGX_PDF_connection_probe/value_hunter_v27.py --financials value_hunter_results/value_hunter_financials.json --output value_hunter_v27_results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-hunter-v27-results
          path: |
            value_hunter_results/
            value_hunter_v27_results/
          if-no-files-found: warn
