name: VALUE HUNTER audited bank historical indicators v72
on:
  push:
    branches: [main]
    paths:
      - SGX_PDF_connection_probe/bank_indicators_v72.py
      - SGX_PDF_connection_probe/test_bank_indicators_v72.py
      - .github/workflows/value-hunter-v72.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Check banking historical proxy math and ranking isolation
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_bank_audited_publish_v71.py test_bank_indicators_v72.py
