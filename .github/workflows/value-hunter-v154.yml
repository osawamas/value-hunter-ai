name: VALUE HUNTER v154 OCBC SGX exact income components
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/sgx_ocbc_bank_components_v154.py'
      - 'SGX_PDF_connection_probe/test_sgx_ocbc_bank_components_v154.py'
      - '.github/workflows/value-hunter-v154.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v154
  cancel-in-progress: false
jobs:
  bank-components:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test exact income rows and sources
        run: |
          python -m pip install --quiet 'pymupdf>=1.24,<1.28'
          cd SGX_PDF_connection_probe
          python -m unittest -v test_sgx_ocbc_bank_components_v154
      - name: Extract exact OCBC banking components from real SGX original PDF
        run: |
          python SGX_PDF_connection_probe/sgx_ocbc_bank_components_v154.py --originals docs/data/sgx-ocbc-2026q3-pdfs-v145.json --profit docs/data/sgx-ocbc-exact-profit-v152.json --output docs/data/sgx-ocbc-income-components-v154.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('docs/data/sgx-ocbc-income-components-v154.json').read_text())
          assert p['status']=='OCBC_3Q26_9M26_PRIMARY_BANK_INCOME_COMPONENTS_PARSED',p['error']
          r=p['record']
          assert r['bank_statements']['3Q26']['net_interest_income']==2313
          assert r['bank_statements']['9M26']['net_interest_income']==6798
          assert r['independent_third_party_numerical_verification'] is False
          assert r['ranking_eligible'] is False
          f=json.loads(Path('docs/data/latest.json').read_text())
          assert f['ranking_eligible_count']==0
          PY
      - name: Commit independent OCBC issuer source capture without ranking
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python SGX_PDF_connection_probe/sgx_ocbc_bank_components_v154.py --originals docs/data/sgx-ocbc-2026q3-pdfs-v145.json --profit docs/data/sgx-ocbc-exact-profit-v152.json --output docs/data/sgx-ocbc-income-components-v154.json
            git add docs/data/sgx-ocbc-income-components-v154.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(v154): OCBC SGX Q3 9M exact bank income components'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1
