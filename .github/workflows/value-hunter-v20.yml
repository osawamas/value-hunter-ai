name: VALUE HUNTER SGX market join v20
on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1'
permissions:
  contents: read
jobs:
  market-join:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF parser
        run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Unit tests
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_value_hunter_market_v20.py
      - name: Fetch G13/S20 financial PDFs
        env:
          SGX_V18_OUTPUT: ${{ github.workspace }}/sgx_v18_results
        run: python SGX_PDF_connection_probe/sgx_integrated_v18.py
      - name: Integrate financial data
        run: |
          python SGX_PDF_connection_probe/value_hunter_v19.py \
            --v18-dir sgx_v18_results \
            --s68 SGX_PDF_connection_probe/fixtures/S68_FY2026_integrated_v14.json \
            --output value_hunter_results
      - name: Fetch market prices and join
        run: |
          python SGX_PDF_connection_probe/value_hunter_market_v20.py \
            --financials value_hunter_results/value_hunter_financials.json \
            --output value_hunter_market_results
      - name: Upload diagnostic and data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-hunter-v20-results
          path: |
            sgx_v18_results/
            value_hunter_results/
            value_hunter_market_results/
          if-no-files-found: warn
