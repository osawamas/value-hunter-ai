name: VALUE HUNTER official PDF & treasury audit v44
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/s68_official_pdf_v44.py'
      - 'SGX_PDF_connection_probe/g13_treasury_v44.py'
      - 'SGX_PDF_connection_probe/test_official_sources_v44.py'
      - '.github/workflows/value-hunter-v44.yml'
  pull_request:
    paths:
      - 'SGX_PDF_connection_probe/s68_official_pdf_v44.py'
      - 'SGX_PDF_connection_probe/g13_treasury_v44.py'
      - 'SGX_PDF_connection_probe/test_official_sources_v44.py'
      - '.github/workflows/value-hunter-v44.yml'
permissions:
  contents: read
jobs:
  test-and-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Fail-closed regression tests
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_official_sources_v44.py
      - name: Extract G13 official treasury share count
        if: github.event_name != 'pull_request'
        run: python SGX_PDF_connection_probe/g13_treasury_v44.py --output v44-artifacts/g13_treasury.json
      - name: Extract S68 actual official audited PDF
        if: github.event_name != 'pull_request'
        run: python SGX_PDF_connection_probe/s68_official_pdf_v44.py --output v44-artifacts/s68_financials.json
      - name: Upload diagnosis even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-pdf-v44-results
          path: v44-artifacts/
          if-no-files-found: warn
