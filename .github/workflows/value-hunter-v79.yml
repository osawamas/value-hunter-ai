name: VALUE HUNTER 3Q26 issuer bank financials v79
on:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/bank_q3_financials_v79.py'
      - 'SGX_PDF_connection_probe/test_bank_q3_financials_v79.py'
      - '.github/workflows/value-hunter-v79.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        symbol: [D05, O39, U11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Test period separation and extraction failure rules
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_bank_q3_financials_v79.py
      - name: Extract actual 2026 issuer bank Q3 and 9M numbers
        run: python SGX_PDF_connection_probe/bank_q3_financials_v79.py --symbol ${{ matrix.symbol }} --output v79-issuer/${{ matrix.symbol }}.json
      - name: Keep source identity and parsed results as audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-quarter-v79-${{ matrix.symbol }}
          path: v79-issuer/
          if-no-files-found: warn
