name: VALUE HUNTER v133 FY2025 external audit visible evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/external-audit-v133.js'
      - 'docs/test_external_audit_v133.js'
      - '.github/workflows/value-hunter-v133.yml'
permissions:
  contents: read
jobs:
  audit-display:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run audit UI syntax and negative state tests
        run: |
          node --check docs/external-audit-v133.js
          node docs/test_external_audit_v133.js
          node docs/test_ranking_readiness_v118.js
          node docs/test_s63_nine_month_v126.js
      - name: Compare two official auditor reports against current published feed
        run: |
          node - <<'JS'
          const fs=require("node:fs"),assert=require("node:assert/strict");
          const {validate}=require("./docs/external-audit-v133.js");
          const f=JSON.parse(fs.readFileSync("docs/data/latest.json","utf8"));
          const a=JSON.parse(fs.readFileSync("docs/data/sgx-fy2025-audit-assurance-v132.json","utf8"));
          const r=validate(f,a);
          assert.equal(r.length,2);
          assert.equal(f.ranking_eligible_count,0);
          console.log("FY2025 auditor display corresponds to current feed");
          JS
