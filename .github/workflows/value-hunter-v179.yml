name: VALUE HUNTER v179 DBS official 3Q table row locator
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/sgx_dbs_table_locator_v179.py'
      - 'SGX_PDF_connection_probe/test_sgx_dbs_table_locator_v179.py'
      - '.github/workflows/value-hunter-v179.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v179
  cancel-in-progress: false
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate strict original PDF provenance
        run: |
          python -m pip install --quiet 'pymupdf>=1.24,<1.28'
          cd SGX_PDF_connection_probe
          python -m unittest -v test_sgx_dbs_table_locator_v179
      - name: Locate source-bound original SGX quarterly table rows
        run: |
          python SGX_PDF_connection_probe/sgx_dbs_table_locator_v179.py --previous docs/data/sgx-big3-nii-v177.json --output docs/data/sgx-dbs-table-contexts-v179.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/data/sgx-dbs-table-contexts-v179.json').read_text())
          assert d['status']=='DBS_SGX_PRIMARY_TRADING_TABLE_CONTEXTS_CAPTURED',d['error']
          assert d['record']['exact_row_column_validation_completed'] is False
          assert json.loads(Path('docs/data/latest.json').read_text())['ranking_eligible_count']==0
          PY
      - name: Save issuer original row context, no ranking promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python SGX_PDF_connection_probe/sgx_dbs_table_locator_v179.py --previous docs/data/sgx-big3-nii-v177.json --output docs/data/sgx-dbs-table-contexts-v179.json
            git add docs/data/sgx-dbs-table-contexts-v179.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(v179): official DBS trading PDF table labels and column contexts'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
