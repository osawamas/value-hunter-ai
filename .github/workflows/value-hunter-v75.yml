name: VALUE HUNTER historical bank treasury shares v75
on:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/bank_historical_shares_v75.py'
      - 'SGX_PDF_connection_probe/test_bank_historical_shares_v75.py'
      - '.github/workflows/value-hunter-v75.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        symbol: [O39, U11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Historical bank shareholding regression tests
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_bank_historical_shares_v75.py
      - name: Parse actual annual bank treasury shares
        run: python SGX_PDF_connection_probe/bank_historical_shares_v75.py --symbol ${{ matrix.symbol }} --output v75/${{ matrix.symbol }}.json
      - name: Upload exact issuer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-treasury-v75-${{ matrix.symbol }}
          path: v75/
          if-no-files-found: warn
