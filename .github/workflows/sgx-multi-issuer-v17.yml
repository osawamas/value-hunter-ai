name: SGX multi issuer coordinate audit v17
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF reader
        run: python -m pip install 'pymupdf>=1.24,<1.28'
      - name: Unit tests
        run: python -m unittest discover -s SGX_PDF_connection_probe -p test_coordinate_audit_v17.py -v
      - name: Capture G13 and S20 layout evidence
        run: python SGX_PDF_connection_probe/coordinate_audit_v17.py
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgx-multi-issuer-v17-results
          path: sgx_v17_results/
          if-no-files-found: warn
