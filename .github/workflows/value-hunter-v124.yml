name: VALUE HUNTER v124 G13 share source date discrepancy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/g13_share_source_gap_v124.py'
      - 'SGX_PDF_connection_probe/test_g13_share_source_gap_v124.py'
      - '.github/workflows/value-hunter-v124.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v124
  cancel-in-progress: false
jobs:
  date-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Adversarial as-of-date and quantity tests
        run: |
          cd SGX_PDF_connection_probe
          python -m unittest -v test_g13_share_source_gap_v124
      - name: Compare real G13 primary document with published shares
        run: |
          python SGX_PDF_connection_probe/g13_share_source_gap_v124.py --feed docs/data/latest.json --original docs/data/sgx-g13-june10-shares-v122.json --output docs/data/sgx-g13-share-date-gap-v124.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("docs/data/sgx-g13-share-date-gap-v124.json").read_text())
          assert a["quantity_matched"] is True
          assert a["date_difference_days"]==20
          assert a["primary_source_proves_published_date"] is False
          assert a["ranking_eligible"] is False
          f=json.loads(Path("docs/data/latest.json").read_text())
          assert f["ranking_eligible_count"]==0
          PY
      - name: Save explicit provenance date gap without valuation change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/sgx-g13-share-date-gap-v124.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(v124): distinguish June 10 SGX shares from June 30 published date'
            git push
          fi
