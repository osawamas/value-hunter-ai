name: VALUE HUNTER v127 dated G13 half-year primary shares proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/g13_primary_h1_reconcile_v127.py'
      - 'SGX_PDF_connection_probe/test_g13_primary_h1_reconcile_v127.py'
      - '.github/workflows/value-hunter-v127.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v127
  cancel-in-progress: false
jobs:
  primary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF parser and run negative tests
        run: |
          python -m pip install --quiet 'pymupdf>=1.24,<1.28'
          cd SGX_PDF_connection_probe
          python -m unittest -v test_g13_primary_h1_reconcile_v127
      - name: Live SGX half-year PDF + existing June notice
        run: |
          python SGX_PDF_connection_probe/g13_primary_h1_reconcile_v127.py --feed docs/data/latest.json --june-notice docs/data/sgx-g13-june10-shares-v122.json --output docs/data/sgx-g13-h1-shares-v127.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("docs/data/sgx-g13-h1-shares-v127.json").read_text())
          assert a["published_june30_count_original_primary_supported"] is True
          assert a["shares_after_june30_unchanged_verified"] is False
          assert a["ranking_eligible"] is False
          f=json.loads(Path("docs/data/latest.json").read_text())
          assert f["ranking_eligible_count"]==0
          PY
      - name: Commit verified June 30 share source reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/sgx-g13-h1-shares-v127.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(v127): reconcile G13 June 30 direct official shares with June 10'
            git push
          fi
