name: JPX, SEC and SGX market source verification
on:
  workflow_dispatch:
    inputs:
      check_sec_live:
        description: 'Try live SEC Company Facts from the hosted runner'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'docs/data/market-research-v315.json'
      - 'scripts/verify-market-sources-v315.py'
      - 'scripts/check-representative-valuations.js'
      - 'scripts/check-ibm-personal-refresh.py'
      - 'tests/test_ibm_personal_refresh.py'
      - 'tests/test_representative_valuations.js'
      - 'scripts/check-ranking-provenance-v289.js'
      - 'scripts/check-ranking-license-evidence-v290.js'
      - 'docs/test_ranking_provenance_v289.js'
      - 'docs/test_ranking_license_evidence_v290.js'
      - 'docs/sgx-ranking-validation.js'
      - 'scripts/fetch-sgx-public-quotes.js'
      - 'scripts/apply-sgx-public-quotes.sh'
      - 'scripts/check-sgx-close-readiness.js'
      - 'scripts/stage-sgx-public-quotes.js'
      - 'tests/test_sgx_close_https.js'
      - 'docs/data/sgx-market-license-review-v290.json'
      - 'docs/market-research.js'
      - 'docs/data/latest.json'
      - 'docs/data/sgx-s63-two-website-close-v129.json'
      - 'docs/data/sgx-s63-historical-shares-v423.json'
      - 'SGX_PDF_connection_probe/sgx_s63_buyback_v109.py'
      - 'SGX_PDF_connection_probe/test_sgx_s63_buyback_v109.py'
      - 'docs/data/sgx-s63-parent-equity-v395.json'
      - 'scripts/export-jquants-personal-quotes.py'
      - 'scripts/refresh-jquants-personal.py'
      - 'scripts/verify-jquants-personal-snapshot.py'
      - 'scripts/test-verify-jquants-personal-snapshot.py'
      - 'tests/test_jquants_personal_quotes.py'
      - 'tests/fixtures/sec-filing-excerpts-v316.json'
      - 'tests/fixtures/ibm-sec-original-excerpts/**'
      - 'scripts/build-sec-quarterly-research.py'
      - 'tests/test_sec_quarterly_research.py'
      - 'tests/fixtures/sec-quarterly-excerpts-v332.json'
      - '.github/workflows/market-sources-v315.yml'
permissions:
  contents: read
jobs:
  representative-valuations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_representative_valuations.js
      - run: python3 scripts/test-verify-jquants-personal-snapshot.py
      - run: python3 -m unittest discover -s tests -p test_ibm_personal_refresh.py
      - run: |
          node docs/test_ranking_provenance_v289.js
          node docs/test_ranking_license_evidence_v290.js
          node tests/test_sgx_close_https.js
  japan-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - run: python scripts/verify-market-sources-v315.py --jp-only
      - run: python scripts/verify-market-sources-v315.py --jp-interim-only
      - run: python -m unittest discover -s tests -p 'test_jquants_personal_quotes.py'
      - uses: actions/upload-artifact@v4
        with:
          name: market-source-verification-v315
          path: build/research/market-source-verification-v315.json
  sec-filing-excerpts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python scripts/verify-market-sources-v315.py --check-sec-excerpts
      - run: python -m unittest discover -s tests -p 'test_sec_quarterly_research.py'
      - name: Reconcile IBM stock count and annual financials from saved filing excerpts
        run: |
          python scripts/verify-market-sources-v315.py --sec-ibm-shares-only --fixture-directory tests/fixtures/ibm-sec-original-excerpts
          python scripts/verify-market-sources-v315.py --sec-ibm-annual-only --fixture-directory tests/fixtures/ibm-sec-original-excerpts
  sgx-s63-equity-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - run: python scripts/verify-market-sources-v315.py --sgx-s63-equity-only
      - run: python -m unittest discover -s SGX_PDF_connection_probe -p 'test_sgx_s63_buyback_v109.py'
      - run: python scripts/verify-market-sources-v315.py --sgx-s63-shares-only
  sec-ibm-filing-originals:
    if: github.event_name == 'workflow_dispatch' && inputs.check_sec_live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python scripts/verify-market-sources-v315.py --sec-ibm-shares-only
      - run: python scripts/verify-market-sources-v315.py --sec-ibm-annual-only
  sec-companyfacts-originals:
    if: github.event_name == 'workflow_dispatch' && inputs.check_sec_live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python scripts/verify-market-sources-v315.py --sec-originals-only
