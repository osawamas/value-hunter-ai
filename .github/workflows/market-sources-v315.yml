name: JPX and SEC market source verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/data/market-research-v315.json'
      - 'scripts/verify-market-sources-v315.py'
      - 'tests/fixtures/sec-filing-excerpts-v316.json'
      - '.github/workflows/market-sources-v315.yml'
permissions:
  contents: read
jobs:
  japan-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - run: python scripts/verify-market-sources-v315.py --jp-only
      - uses: actions/upload-artifact@v4
        with:
          name: market-source-verification-v315
          path: build/research/market-source-verification-v315.json
  sec-filing-excerpts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python scripts/verify-market-sources-v315.py --check-sec-excerpts
  sec-companyfacts-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python scripts/verify-market-sources-v315.py --sec-originals-only
