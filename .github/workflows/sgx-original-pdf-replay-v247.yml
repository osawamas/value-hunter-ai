name: SGX original PDF live recheck v247
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sgx-original-pdf-replay-v247.yml'
      - 'scripts/replay-sgx-original-pdf-v247.js'
      - 'scripts/probe-sgx-original-v246.js'
      - 'docs/data/sgx-original-pdf-sha-v233.json'
      - 'docs/data/sgx-annual-report-sha-v237.json'
permissions:
  contents: read
jobs:
  original-pdf-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Re-download four issuer original PDFs and compare existing hashes
        run: node scripts/replay-sgx-original-pdf-v247.js
      - name: Retain SHA provenance (not original PDF bytes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgx-original-pdf-live-replay-v247
          path: build/research/sgx-original-pdf-replay-v247.json
          if-no-files-found: warn
          retention-days: 30
