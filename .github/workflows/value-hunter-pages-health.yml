name: VALUE HUNTER public site health v31
on:
  pull_request:
    paths:
      - '.github/workflows/value-hunter-pages-health.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/value-hunter-pages-health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check Pages configuration and HTTP response
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p site_health
          echo "Checking Pages metadata..."
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > site_health/pages_api.json 2> site_health/pages_api_error.txt; then
            echo "PAGES_CONFIG_PRESENT=yes" | tee site_health/status.txt
            python - <<'PY'
          import json
          x=json.load(open('site_health/pages_api.json'))
          print("URL",x.get('html_url'))
          print("STATUS",x.get('status'))
          print("BUILD_TYPE",x.get('build_type'))
          PY
          else
            echo "PAGES_CONFIG_PRESENT=no" | tee site_health/status.txt
            cat site_health/pages_api_error.txt
          fi
          URL="https://osawamas.github.io/value-hunter-ai/"
          STATUS="$(curl -L -sS --max-time 12 -o /dev/null -w '%{http_code}' "$URL" || true)"
          echo "URL=$URL" | tee -a site_health/status.txt
          echo "HTTP_STATUS=$STATUS" | tee -a site_health/status.txt
          cat site_health/status.txt >> "$GITHUB_STEP_SUMMARY"
      - name: List recent financial and website update runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          for workflow in ("value-hunter-v32.yml", "value-hunter-v29.yml"):
              url = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/{workflow}/runs?per_page=6"
              done = subprocess.run(["gh", "api", url], capture_output=True, text=True)
              if done.returncode:
                  print("WORKFLOW", workflow, "UNAVAILABLE", done.stderr[:150])
                  continue
              data = json.loads(done.stdout)
              for run in data.get("workflow_runs", []):
                  print("WORKFLOW", workflow, "RUN", run["id"],
                        "STATUS", run["status"], "RESULT", run.get("conclusion"),
                        "COMMIT", run["head_sha"][:10])
          PY
      - name: Diagnose latest failed dashboard job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, json, subprocess
          url=f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/value-hunter-v29.yml/runs?per_page=8"
          r=subprocess.run(["gh","api",url],capture_output=True,text=True)
          if r.returncode: raise RuntimeError(r.stderr[:300])
          for run in json.loads(r.stdout).get("workflow_runs",[]):
              if run.get("conclusion")!="failure": continue
              uid=run["id"]
              d=subprocess.run(["gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{uid}"],
                               capture_output=True,text=True)
              j=subprocess.run(["gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{uid}/jobs"],
                               capture_output=True,text=True)
              meta=json.loads(d.stdout) if d.returncode==0 else {}
              jobs=json.loads(j.stdout).get("jobs",[]) if j.returncode==0 else []
              print("FAILED_RUN",uid,"EVENT",meta.get("event"),"STATUS",meta.get("status"),
                    "CONCLUSION",meta.get("conclusion"),"JOBS",len(jobs))
              for job in jobs:
                  print("JOB",job.get("id"),job.get("name"),job.get("conclusion"))
              break
          PY
      - name: Upload diagnostic only (no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-hunter-pages-health
          path: site_health/
          if-no-files-found: warn
