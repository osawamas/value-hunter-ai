name: Android JPX rights refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jpx-android-rights-refresh.yml'
      - 'android-private/app/src/main/assets/jpx-share-rights.json'
      - 'android-private/tools/jpx*rights*.py'
      - 'android-private/tools/jpx_share_basis.py'
      - 'android-private/tools/test_jpx_rights_sources.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyMuPDF>=1.24,<2' 'openpyxl>=3.1,<4' 'xlrd>=2,<3'
      - name: Check that refresh preserves notices and handles failed sources
        run: python -m unittest discover -s android-private/tools -p 'test_jpx_rights_sources.py' -v
      - name: Verify a refresh against official JPX sources
        working-directory: android-private
        run: python tools/jpx_android_rights_refresh.py app/src/main/assets/jpx-share-rights.json --start-month 2026-03 --dry-run
