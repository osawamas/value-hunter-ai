name: Android JPX rights refresh

on:
  workflow_dispatch:
  schedule:
    # 14:37 JST, after JPX's 13:00 daily publication window.
    - cron: '37 5 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/jpx-android-rights-refresh.yml'
      - 'android-private/app/src/main/assets/jpx-share-rights.json'
      - 'android-private/tools/jpx*rights*.py'
      - 'android-private/tools/jpx_rapid_feed.py'
      - 'android-private/tools/jpx_share_basis.py'
      - 'android-private/tools/jpx_batch_financial_screen.py'
      - 'android-private/tools/test_jpx_batch_financial_screen.py'
      - 'android-private/tools/test_jpx_rights_sources.py'
      - 'android-private/tools/jpx_adjust_monthly_history.py'
      - 'android-private/tools/test_jpx_adjust_monthly_history.py'

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyMuPDF>=1.24,<2' 'openpyxl>=3.1,<4' 'xlrd>=2,<3'
      - name: Check that refresh preserves notices and handles failed sources
        run: python -m unittest discover -s android-private/tools -p 'test_jpx*.py' -v
      - name: Verify a refresh against official JPX sources
        working-directory: android-private
        run: python tools/jpx_android_rights_refresh.py app/src/main/assets/jpx-share-rights.json --start-month 2026-01 --dry-run
      - name: Verify rapid intervals against both official editions
        working-directory: android-private
        run: python tools/jpx_rapid_feed.py "$RUNNER_TEMP/jpx-rapid-rights.json"

  refresh:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    concurrency:
      group: jpx-android-rights-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyMuPDF>=1.24,<2' 'openpyxl>=3.1,<4' 'xlrd>=2,<3'
      - name: Check that refresh preserves notices and handles failed sources
        run: python -m unittest discover -s android-private/tools -p 'test_jpx_rights_sources.py' -v
      - name: Refresh the rights snapshot from JPX originals
        id: rights_snapshot
        continue-on-error: true
        working-directory: android-private
        run: python tools/jpx_android_rights_refresh.py app/src/main/assets/jpx-share-rights.json --start-month 2026-01
      - name: Refresh the rapid-move exclusions from JPX originals
        id: rapid_snapshot
        continue-on-error: true
        working-directory: android-private
        run: python tools/jpx_rapid_feed.py app/src/main/assets/jpx-rapid-rights.json
      - name: Commit the verified rights snapshot if it changed
        run: |
          if [[ "${{ steps.rights_snapshot.outcome }}" == failure && "${{ steps.rapid_snapshot.outcome }}" == failure ]]; then
            echo 'Neither JPX snapshot could be refreshed.'
            exit 1
          fi
          snapshot=android-private/app/src/main/assets/jpx-share-rights.json
          rapid=android-private/app/src/main/assets/jpx-rapid-rights.json
          git add -- "$snapshot" "$rapid"
          if git diff --cached --quiet -- "$snapshot" "$rapid"; then
            echo 'JPX rights snapshot is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh verified JPX rights data'
          if ! git push origin HEAD:refs/heads/main; then
            git fetch origin main
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/main
          fi
