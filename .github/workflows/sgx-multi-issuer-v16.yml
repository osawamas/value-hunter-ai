name: SGX multi issuer validation triage v16
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test v16
        run: |
          cd SGX_PDF_connection_probe
          python -m unittest -v test_multi_issuer_validation_v16.py
      - name: Obtain fresh v15 evidence
        run: |
          python -m pip install pymupdf
          SGX_V15_OUTPUT=sgx_v15_results python SGX_PDF_connection_probe/multi_issuer_v15.py
      - name: Run v16 conservative triage
        run: |
          python SGX_PDF_connection_probe/multi_issuer_validation_v16.py --input sgx_v15_results --output sgx_v16_results
      - name: Upload results even on error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgx-multi-issuer-v16-results
          path: |
            sgx_v15_results/
            sgx_v16_results/
          if-no-files-found: warn
