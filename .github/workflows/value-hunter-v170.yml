name: VALUE HUNTER v170 DBS SGX original 3Q26 banking disclosure
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/sgx_dbs_q3_v170.py'
      - 'SGX_PDF_connection_probe/test_sgx_dbs_q3_v170.py'
      - '.github/workflows/value-hunter-v170.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v170
  cancel-in-progress: false
jobs:
  dbs-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original-only rejection tests
        run: |
          python -m pip install --quiet 'pymupdf>=1.24,<1.28'
          cd SGX_PDF_connection_probe
          python -m unittest -v test_sgx_dbs_q3_v170
      - name: Fetch genuine SGX D05 3Q release and CFO PDF
        run: |
          python SGX_PDF_connection_probe/sgx_dbs_q3_v170.py --output docs/data/sgx-dbs-2026q3-original-v170.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("docs/data/sgx-dbs-2026q3-original-v170.json").read_text())
          if s["record"]:
           assert s["record"]["symbol"]=="D05"
           assert s["record"]["independent_earnings_reperformance"] is False
           assert s["record"]["per_pbr_ranking_permitted"] is False
          assert json.loads(Path("docs/data/latest.json").read_text())["ranking_eligible_count"]==0
          print(s["status"],s["error"])
          PY
      - name: Commit isolated original DBS quarter evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python SGX_PDF_connection_probe/sgx_dbs_q3_v170.py --output docs/data/sgx-dbs-2026q3-original-v170.json
            git add docs/data/sgx-dbs-2026q3-original-v170.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(v170): SGX original DBS 3Q26 announcement and CFO slides evidence'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
