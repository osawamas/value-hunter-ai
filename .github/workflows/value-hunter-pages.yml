name: VALUE HUNTER dashboard publish v46
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/value-hunter-pages.yml'
  workflow_run:
    workflows: ["VALUE HUNTER SGX dashboard data refresh v29"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: value-hunter-pages-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate dashboard JavaScript and non-investable candidate browser
        run: |
          node --check docs/app.js
          node --check docs/universe.js
          node docs/test_universe_v100.js
          node --check docs/share-warning-v111.js
          node docs/test_share_warning_v111.js
          node --check docs/bank-quote-research-v116.js
          node docs/test_bank_quote_research_v116.js
          node --check docs/ranking-readiness-v118.js
          node docs/test_ranking_readiness_v118.js
          node --check docs/g13-quarter-warning-v123.js
          node docs/test_g13_quarter_warning_v123.js
          node --check docs/s63-nine-month-v126.js
          node docs/test_s63_nine_month_v126.js
          node --check docs/external-audit-v133.js
          node docs/test_external_audit_v133.js
          node --check docs/first-issuer-gate-v138.js
          node docs/test_first_issuer_gate_v138.js
          node --check docs/annual-arithmetic-v141.js
          node docs/test_annual_arithmetic_v141.js
  pages-setup:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check Pages site exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages enabled; deployment can proceed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages NOT enabled. Repository owner must select Settings -> Pages -> Build and deployment -> GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
          fi
  pages:
    needs: [validate, pages-setup]
    if: needs.pages-setup.outputs.enabled == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
