name: VALUE HUNTER dashboard publish v46
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["VALUE HUNTER SGX dashboard data refresh v29"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: value-hunter-pages-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate dashboard JavaScript
        run: node --check docs/app.js
  pages:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
