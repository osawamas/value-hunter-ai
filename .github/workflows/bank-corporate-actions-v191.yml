permissions:
  contents: read
jobs:
  evidence-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run source, financial-period and ranking integrity regressions
        run: node scripts/verify-evidence-v198.js
      - name: Preserve all individual evidence test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgx-source-integrity-v218-results
          path: build/research/evidence-integrity-v218.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve date-bound UOB and pending OCBC evidence readiness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgx-bank-evidence-readiness-v244
          path: build/research/sgx-bank-evidence-readiness-v243.json
          if-no-files-found: error
          retention-days: 30
