name: VALUE HUNTER three bank dated quote research v95
on:
  push:
    branches: [main]
    paths:
      - SGX_PDF_connection_probe/bank_quote_research_v95.py
      - SGX_PDF_connection_probe/test_bank_quote_research_v95.py
      - .github/workflows/value-hunter-v95.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate historical close research and strict valuation isolation
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_bank_quote_research_v95.py
