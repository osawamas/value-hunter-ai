name: VALUE HUNTER original UOB SGX Nov 12 share notice v88
on:
  push:
    branches: [main]
    paths:
      - SGX_PDF_connection_probe/u11_nov12_primary_v88.py
      - SGX_PDF_connection_probe/sgx_primary_buyback_v84.py
      - .github/workflows/value-hunter-v88.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse SGX original 12-Nov buyback Section D and reconcile counts
        run: python SGX_PDF_connection_probe/u11_nov12_primary_v88.py --output evidence-v88/sgx-uob-nov12.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sgx-nov12-uob-v88
          path: evidence-v88/
          if-no-files-found: warn
