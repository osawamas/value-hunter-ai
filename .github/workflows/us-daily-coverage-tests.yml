name: US daily market coverage probe tests
on:
  push:
    paths:
      - 'android-private/tools/*us_massive_probe.py'
      - 'android-private/tools/us_dolt_sync.py'
      - 'android-private/tools/test_us_dolt_sync.py'
      - 'android-private/tools/test_us_dolt_cache_integrity.py'
      - 'android-private/tools/*us_daily_coverage.py'
      - 'android-private/tools/*us_monitor_*.py'
      - 'android-private/tools/*us_nyse_taq_probe.py'
      - 'android-private/tools/*us_nasdaq_nls_probe.py'
      - 'android-private/tools/*us_public_files_probe.py'
      - 'android-private/tools/*us_sec_statement_coverage.py'
      - 'android-private/tools/*us_sec_share_coverage.py'
      - 'android-private/tools/*us_sec_filing_followup.py'
      - 'android-private/tools/*us_sec_original_cover.py'
      - 'scripts/us_price_only_guard.py'
      - 'scripts/test_us_price_only_guard.py'
      - '.github/workflows/us-daily-coverage-tests.yml'
  pull_request:
    paths:
      - 'android-private/tools/*us_massive_probe.py'
      - 'android-private/tools/us_dolt_sync.py'
      - 'android-private/tools/test_us_dolt_sync.py'
      - 'android-private/tools/test_us_dolt_cache_integrity.py'
      - 'android-private/tools/*us_daily_coverage.py'
      - 'android-private/tools/*us_monitor_*.py'
      - 'android-private/tools/*us_nyse_taq_probe.py'
      - 'android-private/tools/*us_nasdaq_nls_probe.py'
      - 'android-private/tools/*us_public_files_probe.py'
      - 'android-private/tools/*us_sec_statement_coverage.py'
      - 'android-private/tools/*us_sec_share_coverage.py'
      - 'android-private/tools/*us_sec_filing_followup.py'
      - 'android-private/tools/*us_sec_original_cover.py'
      - 'scripts/us_price_only_guard.py'
      - 'scripts/test_us_price_only_guard.py'
      - '.github/workflows/us-daily-coverage-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test Dolt sync, price, issuer and statement coverage
        working-directory: android-private/tools
        run: python3 -m unittest -v test_us_dolt_sync test_us_dolt_cache_integrity test_us_massive_probe test_us_daily_coverage test_us_nyse_taq_probe test_us_nasdaq_nls_probe test_us_public_files_probe test_us_sec_statement_coverage test_us_sec_share_coverage test_us_sec_filing_followup test_us_sec_original_cover test_us_monitor_sync
      - name: Test US price-only notification eligibility
        working-directory: scripts
        run: python3 -m unittest -v test_us_price_only_guard
