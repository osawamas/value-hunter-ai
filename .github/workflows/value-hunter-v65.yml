name: VALUE HUNTER DBS banking evidence v65
on:
  push:
    branches: [main]
    paths:
      - SGX_PDF_connection_probe/d05_bank_bundle_v65.py
      - SGX_PDF_connection_probe/d05_bank_publish_v65.py
      - SGX_PDF_connection_probe/test_d05_bank_bundle_v65.py
      - .github/workflows/value-hunter-v65.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Cross-check bank scope and one-download bundles
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_d05_bank_bundle_v65.py
      - name: Single DBS issuer PDF extraction
        run: python SGX_PDF_connection_probe/d05_bank_bundle_v65.py --output d05-v65/bundle.json
      - name: Preserve verified evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d05-bank-evidence-v65
          path: d05-v65/
          if-no-files-found: warn
