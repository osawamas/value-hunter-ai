name: IBM demo preflight
on:
  workflow_dispatch:
  schedule:
    # Monday–Friday 23:17 UTC, after the regular US session.
    - cron: '17 23 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ibm-demo-preflight.yml'
      - 'scripts/check-ibm-personal-refresh.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: ibm-demo-preflight
  cancel-in-progress: false
jobs:
  ibm-demo-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check IBM price retrieval and dated share evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report=$(mktemp)
          trap 'rm -f "$report"' EXIT
          status=0
          python3 scripts/check-ibm-personal-refresh.py --demo --latest-two > "$report" || status=$?
          if (( status != 0 && status != 2 )); then
            echo "IBM preflight failed before producing a valuation report." >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          latest=$(jq -er '.preflightChecks.current.date | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' "$report")
          observed=$latest
          previous_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ibm-preflight-session&per_page=100" \
            --jq '[.artifacts[]
              | select(.expired == false and .workflow_run.head_branch == "main"
                and .workflow_run.head_repository_id == '"$GITHUB_REPOSITORY_ID"')
              | .workflow_run.id | select(. < '"$GITHUB_RUN_ID"')] | max // empty')
          previous=''
          if [[ -n "$previous_run" ]]; then
            gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" --name ibm-preflight-session --dir "$RUNNER_TEMP/ibm-previous"
            previous=$(cat "$RUNNER_TEMP/ibm-previous/session.txt")
            [[ "$previous" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          fi
          if [[ -z "$previous" ]]; then
            comparison=first
            update="First recorded trading date ($latest)."
          elif [[ "$latest" > "$previous" ]]; then
            comparison=advanced
            update="Trading date advanced from $previous to $latest."
          elif [[ "$latest" == "$previous" ]]; then
            comparison=unchanged
            update="No new trading date since the preceding recorded run ($latest)."
          else
            comparison=older
            update="Provider returned an older date ($latest; last recorded: $previous)."
            latest=$previous
          fi
          {
            echo '### IBM demo preflight'
            echo
            echo "$update"
            if [[ -n "$previous_run" ]]; then
              echo "Comparison baseline: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$previous_run"
            fi
            echo
            echo '| Trading date | Close retrieval | Valuation | Earlier share disclosure |'
            echo '| --- | --- | --- | --- |'
            jq -er '.preflightChecks[] | "| \(.date) | \(.closeStatus) | \(.valuationStatus) | \(if .referenceShareSource then "[\(.referenceShareDate)](\(.referenceShareSource))" else "—" end) |"' "$report"
            if (( status == 2 )); then
              echo
              echo 'Valuation pending. See the per-session status above.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$latest" > "$RUNNER_TEMP/session.txt"
          jq -e --arg comparison "$comparison" --arg observed "$observed" \
            --arg retained "$latest" --arg previousRun "$previous_run" '
            {
              schemaVersion: 1,
              comparison: $comparison,
              observedDate: $observed,
              retainedDate: $retained,
              baselineRunId: (if $previousRun == "" then null else $previousRun end),
              checks: (.preflightChecks | map_values({date, closeStatus, valuationStatus,
                referenceShareDate, referenceShareSource}))
            }' "$report" > "$RUNNER_TEMP/session.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ibm-preflight-session
          path: |
            ${{ runner.temp }}/session.txt
            ${{ runner.temp }}/session.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true
