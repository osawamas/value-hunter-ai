name: VALUE HUNTER v142 official SGX historical boardlot code subset
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/sgx_boardlot_subset_v142.py'
      - 'SGX_PDF_connection_probe/test_sgx_boardlot_subset_v142.py'
      - '.github/workflows/value-hunter-v142.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v142
  cancel-in-progress: false
jobs:
  official-subset:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Adversarial historical identity tests
        run: |
          cd SGX_PDF_connection_probe
          python -m unittest -v test_sgx_boardlot_subset_v142
      - name: Fetch actual dated SGX trading page
        run: |
          python SGX_PDF_connection_probe/sgx_boardlot_subset_v142.py --output docs/data/sgx-boardlot-subset-v142.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("docs/data/sgx-boardlot-subset-v142.json").read_text())
          if x["record"]:
            assert x["record"]["official_historical_ticker_count"]==11
            assert x["record"]["subset_is_complete_current_sgx_master"] is False
          feed=json.loads(Path("docs/data/latest.json").read_text())
          assert feed["ranking_eligible_count"]==0
          print(x["status"],x["error"])
          PY
      - name: Commit isolated official source diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python SGX_PDF_connection_probe/sgx_boardlot_subset_v142.py --output docs/data/sgx-boardlot-subset-v142.json
            git add docs/data/sgx-boardlot-subset-v142.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(v142): historical SGX 11 stock code subset research'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
