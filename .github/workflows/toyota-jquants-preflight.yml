name: Toyota J-Quants preflight

on:
  workflow_dispatch:
  schedule:
    - cron: '37 10 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/toyota-jquants-preflight.yml'
      - 'scripts/refresh-jquants-personal.py'
      - 'scripts/export-jquants-personal-quotes.py'
      - 'scripts/verify-jquants-personal-snapshot.py'
      - 'scripts/check-representative-valuations.js'
      - 'docs/data/market-research-v315.json'

permissions:
  contents: read

jobs:
  toyota-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare Toyota closes and same-date share filings
        shell: bash
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          echo '### Toyota J-Quants preflight' >> "$GITHUB_STEP_SUMMARY"
          evidence=$(python3 scripts/refresh-jquants-personal.py --toyota-free-evidence)
          {
            echo
            echo '| Share count date | Filing |'
            echo '| --- | --- |'
            jq -er '.[] | "| \(.date) | [\(.disclosedOn // "Issuer filing")](\(.source)) |"' <<< "$evidence"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -z "$JQUANTS_API_KEY" ]]; then
            echo 'Live retrieval skipped because JQUANTS_API_KEY is unavailable.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          earlier=$(jq -er '.[0].date' <<< "$evidence")
          later=$(jq -er '.[1].date' <<< "$evidence")
          checks=$(python3 scripts/refresh-jquants-personal.py --toyota-preflight "$earlier" "$later") || status=$?
          if [[ -n "$checks" ]]; then
            {
              echo '| Trading date | Close | Annual valuation | Trailing PER / period-end PBR | Interim filing |'
              echo '| --- | --- | --- | --- | --- |'
              jq -er '.[] |
                "| \(.date) | \(.close) | \(.annual) | \(if .interim then "calculated" else "unavailable" end) | \(if .interim then "[\(.interim.disclosedOn)](\(.interim.source))" else "—" end) |"' <<< "$checks"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
