name: Toyota J-Quants preflight

on:
  workflow_dispatch:
    inputs:
      earlier_session:
        description: 'Earlier disclosed Toyota share date (YYYY-MM-DD)'
        type: string
      later_session:
        description: 'Later disclosed Toyota share date (YYYY-MM-DD)'
        type: string
  schedule:
    - cron: '37 10 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/toyota-jquants-preflight.yml'
      - 'scripts/refresh-jquants-personal.py'
      - 'scripts/export-jquants-personal-quotes.py'
      - 'scripts/verify-jquants-personal-snapshot.py'
      - 'scripts/check-representative-valuations.js'
      - 'docs/data/market-research-v315.json'

permissions:
  contents: read

jobs:
  toyota-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare Toyota closes and same-date share filings
        shell: bash
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          EARLIER_SESSION: ${{ inputs.earlier_session }}
          LATER_SESSION: ${{ inputs.later_session }}
        run: |
          echo '### Toyota J-Quants preflight' >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$EARLIER_SESSION" || -n "$LATER_SESSION" ]]; then
            if [[ ! "$EARLIER_SESSION" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ || ! "$LATER_SESSION" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo 'Provide both dates in YYYY-MM-DD format.' | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            evidence=$(python3 scripts/refresh-jquants-personal.py --toyota-pair-evidence "$EARLIER_SESSION" "$LATER_SESSION")
          else
            evidence=$(python3 scripts/refresh-jquants-personal.py --toyota-free-evidence)
          fi
          {
            echo
            echo '| Share count date | Filing | Estimated free-plan availability |'
            echo '| --- | --- | --- |'
            jq -er '.[] | "| \(.date) | [\(.disclosedOn // "Issuer filing")](\(.source)) | \(if .freePlanEstimate.status == "awaiting_delay" then "From \(.freePlanEstimate.estimatedAvailableOn)" elif .freePlanEstimate.status == "older_than_estimated_window" then "Older than estimated range" else "Within estimated range" end) |"' <<< "$evidence"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -z "$JQUANTS_API_KEY" ]]; then
            echo 'Live retrieval skipped because JQUANTS_API_KEY is unavailable.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          earlier=$(jq -er '.[0].date' <<< "$evidence")
          later=$(jq -er '.[1].date' <<< "$evidence")
          checks=$(python3 scripts/refresh-jquants-personal.py --toyota-preflight "$earlier" "$later") || status=$?
          if [[ -n "$checks" ]]; then
            {
              echo '| Trading date | Close | Annual valuation | Trailing PER / period-end PBR | Interim filing |'
              echo '| --- | --- | --- | --- | --- |'
              jq -er '.[] |
                "| \(.date) | \(.close) | \(.annual) | \(if .interim then "calculated" else "unavailable" end) | \(if .interim then "[\(.interim.disclosedOn)](\(.interim.source))" else "—" end) |"' <<< "$checks"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
