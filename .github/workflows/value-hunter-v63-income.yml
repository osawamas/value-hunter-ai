name: VALUE HUNTER DBS banking income v63
on:
  push:
    branches: [main]
    paths:
      - SGX_PDF_connection_probe/d05_bank_income_v63.py
      - SGX_PDF_connection_probe/test_d05_bank_income_v63.py
      - .github/workflows/value-hunter-v63-income.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Synthetic bank accounting tests
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_d05_bank_income_v63.py
      - name: Extract DBS annual issuer PDF consolidated banking income
        run: python SGX_PDF_connection_probe/d05_bank_income_v63.py --output d05-v63-income/income.json
      - name: Save nonpromoted issuer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d05-bank-income-v63
          path: d05-v63-income/
          if-no-files-found: warn
