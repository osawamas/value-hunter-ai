name: VALUE HUNTER v131 S63 FY2025 external auditor primary proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/s63_fy2025_external_audit_v131.py'
      - 'SGX_PDF_connection_probe/test_s63_fy2025_external_audit_v131.py'
      - '.github/workflows/value-hunter-v131.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v131
  cancel-in-progress: false
jobs:
  opinion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF parser and audit identity tests
        run: |
          python -m pip install --quiet 'pymupdf>=1.24,<1.28'
          cd SGX_PDF_connection_probe
          python -m unittest -v test_s63_fy2025_external_audit_v131
      - name: Fetch SGX original signed FY2025 auditor report
        run: |
          python SGX_PDF_connection_probe/s63_fy2025_external_audit_v131.py --feed docs/data/latest.json --output docs/data/sgx-s63-fy2025-auditor-v131.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("docs/data/sgx-s63-fy2025-auditor-v131.json").read_text())
          assert x["schema_version"]=="sgx-s63-auditor-probe-v131"
          if x["record"]:
            assert x["record"]["ranking_eligible"] is False
            assert x["record"]["parent_equity_independently_reconciled"] is False
          f=json.loads(Path("docs/data/latest.json").read_text())
          assert f["ranking_eligible_count"]==0
          print(x["status"],x["error"])
          PY
      - name: Save separate auditor evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/sgx-s63-fy2025-auditor-v131.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(v131): external S63 FY2025 auditor original opinion'
            git push
          fi
