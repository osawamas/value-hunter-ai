name: SGX batch PDF audit
on:
  workflow_dispatch:
jobs:
  batch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pymupdf
      - name: Run batch unit tests
        run: python -m unittest discover -s SGX_PDF_connection_probe -p 'test_batch_probe.py' -v
      - name: Audit SGX PDF documents
        run: python SGX_PDF_connection_probe/batch_probe.py
      - name: Upload batch report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgx-batch-results
          path: batch_results/
          if-no-files-found: warn
