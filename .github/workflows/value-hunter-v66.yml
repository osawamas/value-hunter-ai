name: VALUE HUNTER OCBC UOB statement discovery v66
on:
  push:
    branches: [main]
    paths:
      - SGX_PDF_connection_probe/bank_statements_probe_v66.py
      - .github/workflows/value-hunter-v66.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        symbol: [O39, U11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Locate issuer bank statement pages (no value promotion)
        run: python SGX_PDF_connection_probe/bank_statements_probe_v66.py --symbol ${{ matrix.symbol }} --output probe-v66/${{ matrix.symbol }}.json
      - name: Save statement page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-v66-${{ matrix.symbol }}
          path: probe-v66/
          if-no-files-found: warn
