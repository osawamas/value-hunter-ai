name: VALUE HUNTER v169 bank source coverage by period
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/bank-coverage-v169.js'
      - 'docs/test_bank_coverage_v169.js'
      - '.github/workflows/value-hunter-v169.yml'
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate period-separated bank evidence from live repository JSON
        run: |
          node --check docs/bank-coverage-v169.js
          node docs/test_bank_coverage_v169.js
          node docs/test_reference_valuation_guard_v168.js
          node docs/test_ocbc_bundle_summary_v167.js
      - name: Assert no bank market rank was enabled
        run: |
          node - <<'JS'
          const f=require('./docs/data/latest.json');
          if(f.ranking_eligible_count!==0||f.records.some(x=>x.ranking_eligible!==false))
            throw Error('Unsafe bank ranking promotion');
          console.log('All registered issuers still marked research only');
          JS
