name: VALUE HUNTER G13 2026 issuer PDF discovery v48
on:
  push:
    branches: [main]
    paths:
      - SGX_PDF_connection_probe/g13_2026_discovery_v48.py
      - SGX_PDF_connection_probe/g13_shareholding_v48.py
      - SGX_PDF_connection_probe/test_g13_shareholding_v48.py
      - .github/workflows/value-hunter-v48.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Validate G13 gross/treasury/net fail-closed synthetic tests
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_g13_shareholding_v48.py
      - name: Parse and reconcile official G13 1H2026 share count
        run: python SGX_PDF_connection_probe/g13_shareholding_v48.py --output g13_v48_results/shareholding.json
      - name: Probe official G13 1H2026 PDF without promoting any value
        run: python SGX_PDF_connection_probe/g13_2026_discovery_v48.py --output g13_v48_results/discovery.json
      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-v48-source-discovery
          path: g13_v48_results/
          if-no-files-found: warn
