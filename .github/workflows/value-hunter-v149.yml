name: VALUE HUNTER v149 OCBC SGX primary bank health ratios
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/sgx_ocbc_bank_ratios_v149.py'
      - 'SGX_PDF_connection_probe/test_sgx_ocbc_bank_ratios_v149.py'
      - '.github/workflows/value-hunter-v149.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v149
  cancel-in-progress: false
jobs:
  bank-health:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF parser and test original-source rejection
        run: |
          python -m pip install --quiet 'pymupdf>=1.24,<1.28'
          cd SGX_PDF_connection_probe
          python -m unittest -v test_sgx_ocbc_bank_ratios_v149
      - name: Extract real O39 issuer bank-health ratios
        run: |
          python SGX_PDF_connection_probe/sgx_ocbc_bank_ratios_v149.py --manifest docs/data/sgx-ocbc-2026q3-pdfs-v145.json --profit docs/data/sgx-ocbc-2026q3-bank-profit-v146.json --output docs/data/sgx-ocbc-2026q3-bank-ratios-v149.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("docs/data/sgx-ocbc-2026q3-bank-ratios-v149.json").read_text())
          if x["record"]:
           assert x["record"]["independent_numerical_verification"] is False
           assert x["record"]["per_pbr_ranking_permitted"] is False
          f=json.loads(Path("docs/data/latest.json").read_text())
          assert f["ranking_eligible_count"]==0
          print(x["status"],x["error"])
          PY
      - name: Save issuer bank-ratio source observation only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python SGX_PDF_connection_probe/sgx_ocbc_bank_ratios_v149.py --manifest docs/data/sgx-ocbc-2026q3-pdfs-v145.json --profit docs/data/sgx-ocbc-2026q3-bank-profit-v146.json --output docs/data/sgx-ocbc-2026q3-bank-ratios-v149.json
            git add docs/data/sgx-ocbc-2026q3-bank-ratios-v149.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(v149): OCBC 3Q primary source bank health ratios'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
