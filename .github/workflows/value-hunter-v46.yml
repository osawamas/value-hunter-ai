name: VALUE HUNTER S68 annual shareholding v46
on:
  push:
    branches: [main]
    paths:
      - SGX_PDF_connection_probe/s68_shareholding_v46.py
      - SGX_PDF_connection_probe/test_s68_shareholding_v46.py
      - .github/workflows/value-hunter-v46.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Synthetic rejection tests
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_s68_shareholding_v46.py
      - name: Verify official annual shareholding PDF
        run: python SGX_PDF_connection_probe/s68_shareholding_v46.py --output results_v46/s68_shares.json
      - name: Keep audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s68-annual-shares-v46
          path: results_v46/
          if-no-files-found: warn
