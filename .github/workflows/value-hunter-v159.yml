name: VALUE HUNTER v159 OCBC selected primary bank balance figures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/sgx_ocbc_bank_balance_v159.py'
      - 'SGX_PDF_connection_probe/test_sgx_ocbc_bank_balance_v159.py'
      - '.github/workflows/value-hunter-v159.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v159
  cancel-in-progress: false
jobs:
  selected:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test authentic selected Q3 bank balance rows
        run: |
          python -m pip install --quiet 'pymupdf>=1.24,<1.28'
          cd SGX_PDF_connection_probe
          python -m unittest -v test_sgx_ocbc_bank_balance_v159
      - name: Fetch real SGX OCBC balance sheet and extract exact equity
        run: |
          python SGX_PDF_connection_probe/sgx_ocbc_bank_balance_v159.py --manifest docs/data/sgx-ocbc-2026q3-pdfs-v145.json --output docs/data/sgx-ocbc-bank-balance-v159.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/data/sgx-ocbc-bank-balance-v159.json').read_text())
          assert x['status']=='OCBC_Q3_PRIMARY_BANK_BALANCE_ROWS_PARSED',x['error']
          r=x['record']
          assert r['selected_bank_items']['ordinary_equity']['sgd_millions']==60899
          assert r['selected_bank_items']['equity_attributable_to_bank_equity_holders']['sgd_millions']==63347
          assert r['pbr_eligible'] is False
          assert r['ranking_eligible'] is False
          assert json.loads(Path('docs/data/latest.json').read_text())['ranking_eligible_count']==0
          PY
      - name: Commit original dated banking snapshot without promoting valuation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python SGX_PDF_connection_probe/sgx_ocbc_bank_balance_v159.py --manifest docs/data/sgx-ocbc-2026q3-pdfs-v145.json --output docs/data/sgx-ocbc-bank-balance-v159.json
            git add docs/data/sgx-ocbc-bank-balance-v159.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(v159): OCBC dated bank ordinary equity and assets from SGX PDF'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1
