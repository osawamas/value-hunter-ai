name: Android original branded UI screenshot smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android-private/app/src/main/**'
      - 'android-private/app/build.gradle'
      - 'android-private/tools/check_branded_ui_emulator.sh'
      - '.github/workflows/android-brand-ui-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'android-private/app/src/main/**'
      - 'android-private/app/build.gradle'
      - 'android-private/tools/check_branded_ui_emulator.sh'

permissions:
  contents: read

jobs:
  brand-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile original-art APK
        working-directory: android-private
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Photograph splash and home on actual emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          PROBE_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android-private/tools/check_branded_ui_emulator.sh
      - name: Upload reproducible UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-brand-ui-android-${{ matrix.api }}
          path: brand-ui-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
