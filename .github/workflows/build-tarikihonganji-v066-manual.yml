name: Build Tarikihonganji diagnostic APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tarikihonganji-v066-manual.yml'

permissions:
  contents: read

jobs:
  android-build12:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current verified main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify tests and build independent APK
        working-directory: android-private
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify generated debug APK
        run: test -s android-private/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload independent diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: tarikihonganji-main-us-ultravalue-fixed-apk
          path: android-private/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
