name: Build30 public market coverage
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/build30-live-coverage.yml'
      - 'android-private/tools/build30_public_sources.py'
      - 'android-private/tools/probe_jpx_archive.py'
      - 'android-private/tools/UsLiveCoverage.java'
      - 'android-private/tools/check_jpx_live_emulator.sh'
      - 'android-private/app/src/androidTest/java/jp/valuehunter/privatewatch/JpxPdfGeometryProbe.java'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: build30-live-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-data:
    if: github.event.repository.private == false && (github.event_name != 'pull_request' || github.head_ref == 'integration/valuehunter-flexible-coverage')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      results: ${{ steps.results.outputs.labels }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Collect public JPX and US inputs
        id: acquire
        run: |
          python -m pip install openpyxl pymupdf
          python android-private/tools/build30_public_sources.py coverage-results
          python android-private/tools/probe_jpx_archive.py coverage-results
          if [ -s coverage-results/jpx-session.pdf ]; then
            echo 'jpx=true' >> "$GITHUB_OUTPUT"
            day=$(python -c 'import json; print(json.load(open("coverage-results/jpx-public-coverage.json"))["trade_date"])')
            echo "jpx_day=$day" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Android US valuation engine against acquired data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          dir="$(mktemp -d)"
          curl -fsSL --max-time 30 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$dir/json.jar"
          bash android-private/tools/compile_us_replay.sh "$dir"
          java -cp "$dir/classes:$dir/json.jar" jp.valuehunter.privatewatch.UsLiveCoverage coverage-results
      - uses: gradle/actions/setup-gradle@v4
        if: steps.acquire.outputs.jpx == 'true'
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - name: Build JPX instrumentation
        id: jpx_build
        if: steps.acquire.outputs.jpx == 'true'
        run: |
          set -o pipefail
          (cd android-private && gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g :app:assembleDebug :app:assembleDebugAndroidTest) 2>&1 | tee coverage-results/jpx-build.log
      - name: Enable JPX emulator KVM
        if: steps.acquire.outputs.jpx == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache/restore@v4
        if: steps.acquire.outputs.jpx == 'true'
        with:
          path: coverage-jpx-cache
          key: build30-jpx-v2-${{ steps.acquire.outputs.jpx_day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: build30-jpx-v2-${{ steps.acquire.outputs.jpx_day }}-
      - name: Run bounded JPX financial acquisition and Android valuation
        if: steps.acquire.outputs.jpx == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android-private/tools/check_jpx_live_emulator.sh
      - uses: actions/cache/save@v4
        if: always() && hashFiles('coverage-jpx-cache/jpx-automatic-finance-v1.xml') != ''
        with:
          path: coverage-jpx-cache
          key: build30-jpx-v2-${{ steps.acquire.outputs.jpx_day }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Summarize source and valuation outcomes
        if: always()
        id: results
        run: |
          JPX_BUILD_OUTCOME="${{ steps.jpx_build.outcome }}" python android-private/tools/build30_public_sources.py --summary coverage-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build30-coverage
          path: |
            coverage-results/*.json
            coverage-results/jpx-probe.log
            coverage-results/jpx-build.log
            coverage-results/jpx-parser.log
            coverage-results/*listed.txt
            coverage-results/jpx-*.html
          retention-days: 3
  publish-results:
    if: always() && needs.public-data.outputs.results != ''
    needs: public-data
    strategy:
      matrix:
        result: ${{ fromJSON(needs.public-data.outputs.results) }}
    name: ${{ matrix.result }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'Coverage details are attached to the public-data job.'
