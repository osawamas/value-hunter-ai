name: Build30 public market coverage
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/build30-live-coverage.yml'
      - 'android-private/tools/build30_public_sources.py'
      - 'android-private/tools/probe_jpx_archive.py'
      - 'android-private/tools/jpx_hachiquant_coverage.py'
      - 'android-private/tools/jpx_edinet_crosscheck.py'
      - 'android-private/tools/UsLiveCoverage.java'
      - 'android-private/app/src/main/java/jp/valuehunter/privatewatch/JpxOperatingValuation.java'
      - 'android-private/tools/us_market_history_probe.py'
      - 'android-private/tools/us_finzdata_probe.py'
      - 'android-private/tools/check_jpx_live_emulator.sh'
      - 'android-private/app/src/androidTest/java/jp/valuehunter/privatewatch/JpxPdfGeometryProbe.java'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: build30-live-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-data:
    if: github.event.repository.private == false && (github.event_name != 'pull_request' || github.head_ref == 'integration/valuehunter-flexible-coverage')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      results: ${{ steps.results.outputs.labels }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Collect public JPX and US inputs
        id: acquire
        run: |
          python -m pip install openpyxl pymupdf xlrd
          python android-private/tools/build30_public_sources.py coverage-results
          python android-private/tools/probe_jpx_archive.py coverage-results
          if [ -s coverage-results/jpx-session.pdf ]; then
            echo 'jpx=true' >> "$GITHUB_OUTPUT"
            day=$(python -c 'import json; print(json.load(open("coverage-results/jpx-public-coverage.json"))["trade_date"])')
            echo "jpx_day=$day" >> "$GITHUB_OUTPUT"
          fi
      - name: Measure the free alternative JPX annual input
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        if: steps.acquire.outputs.jpx == 'true'
        run: |
          day="${{ steps.acquire.outputs.jpx_day }}"
          year="${day:0:4}"
          month="${day:5:2}"
          reports=()
          timeout 60 python android-private/tools/jpx_rights_sources.py \
            --year "$year" --start-month "$((year - 1))-01" --cutoff-month "$((10#$month))" \
            --output "$RUNNER_TEMP/build30-rights" > coverage-results/jpx-rights-sources.json || true
          for report in "$RUNNER_TEMP"/build30-rights/rights-*.pdf; do
            if [[ -s "$report" ]]; then reports+=(--rights-report "$report"); fi
          done
          for report in "$RUNNER_TEMP"/build30-rights/*.xls; do
            if [[ -s "$report" ]]; then reports+=(--daily-rights "$report"); fi
          done
          if timeout 230 python android-private/tools/jpx_hachiquant_coverage.py \
            coverage-results/jpx-list.xlsx coverage-results/jpx-session.pdf --budget-samples-per-market 2 \
            --batch-index 32 --later-filings-output coverage-results/jpx-later-filings.json --valuation-output "$RUNNER_TEMP/jpx-alternative-valuation.json" \
            "${reports[@]}" > coverage-results/jpx-alternative-input.json; then
            python -m json.tool coverage-results/jpx-alternative-input.json
          else
            printf '{"status":"alternative_input_unavailable"}\n' > coverage-results/jpx-alternative-input.json
          fi
      - name: Run Android US valuation engine against acquired data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          dir="$(mktemp -d)"
          curl -fsSL --max-time 30 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$dir/json.jar"
          bash android-private/tools/compile_us_replay.sh "$dir"
          java -cp "$dir/classes:$dir/json.jar" jp.valuehunter.privatewatch.UsLiveCoverage coverage-results --probe-nasdaq-close
      - name: Retrieve the verified historical US listing pair
        id: archived_listings
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build30-coverage
          path: ${{ runner.temp }}/us-archived-listings
          run-id: 46061801303
          github-token: ${{ github.token }}
      - name: Replay the historical US listing pair
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          data="$RUNNER_TEMP/us-archived-listings"
          if [ -s "$data/otherlisted.txt" ] && [ -s "$data/nasdaqlisted.txt" ]; then
            dir="$(mktemp -d)"
            curl -fsSL --max-time 30 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$dir/json.jar"
            bash android-private/tools/compile_us_replay.sh "$dir"
            rm -f "$data/us-public-coverage.json"
            result=0
            timeout 195 java -cp "$dir/classes:$dir/json.jar" jp.valuehunter.privatewatch.UsLiveCoverage "$data" || result=$?
            if [ -s "$data/us-public-coverage.json" ]; then
              cp "$data/us-public-coverage.json" coverage-results/us-archived-coverage.json
            else
              printf '{"status":"replay_incomplete","exit_code":%s,"listing_artifact_run":46061801303}\n' "$result" > coverage-results/us-archived-coverage.json
            fi
          else
            printf '{"status":"archived_listing_pair_unavailable","download_outcome":"%s","listing_artifact_run":46061801303}\n' "${{ steps.archived_listings.outcome }}" > coverage-results/us-archived-coverage.json
          fi
      - name: Check independent free US close providers
        env:
          FINZDATA_API_KEY: ${{ secrets.FINZDATA_API_KEY }}
        run: |
          if [ -s coverage-results/us-public-coverage.json ]; then
            day=$(python -c 'import json; print(json.load(open("coverage-results/us-public-coverage.json")).get("trade_date", ""))')
            if [ -n "$day" ]; then
              python android-private/tools/us_market_history_probe.py "$day" > coverage-results/us-alternative-close-probe.json
              python android-private/tools/us_finzdata_probe.py "$day" > coverage-results/us-finzdata-close-probe.json
            fi
          fi
      - uses: gradle/actions/setup-gradle@v4
        if: steps.acquire.outputs.jpx == 'true'
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - name: Build JPX instrumentation
        id: jpx_build
        if: steps.acquire.outputs.jpx == 'true'
        run: |
          set -o pipefail
          (cd android-private && gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g :app:assembleDebug :app:assembleDebugAndroidTest) 2>&1 | tee coverage-results/jpx-build.log
      - name: Enable JPX emulator KVM
        if: steps.acquire.outputs.jpx == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache/restore@v4
        if: steps.acquire.outputs.jpx == 'true'
        with:
          path: coverage-jpx-cache
          key: build30-jpx-v2-${{ steps.acquire.outputs.jpx_day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            build30-jpx-v2-${{ steps.acquire.outputs.jpx_day }}-
            build30-jpx-v2-
      - name: Run bounded JPX financial acquisition and Android valuation
        if: steps.acquire.outputs.jpx == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android-private/tools/check_jpx_live_emulator.sh
      - uses: actions/cache/save@v4
        if: always() && hashFiles('coverage-jpx-cache/jpx-automatic-finance-v1.xml') != ''
        with:
          path: coverage-jpx-cache
          key: build30-jpx-v2-${{ steps.acquire.outputs.jpx_day }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Summarize source and valuation outcomes
        if: always()
        id: results
        run: |
          JPX_BUILD_OUTCOME="${{ steps.jpx_build.outcome }}" python android-private/tools/build30_public_sources.py --summary coverage-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build30-coverage
          path: |
            coverage-results/*.json
            coverage-results/jpx-probe.log
            coverage-results/jpx-build.log
            coverage-results/jpx-parser.log
            coverage-results/*listed.txt
            coverage-results/jpx-*.html
          retention-days: 3
  publish-results:
    if: always() && needs.public-data.outputs.results != ''
    needs: public-data
    strategy:
      matrix:
        result: ${{ fromJSON(needs.public-data.outputs.results) }}
    name: ${{ matrix.result }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'Coverage details are attached to the public-data job.'
