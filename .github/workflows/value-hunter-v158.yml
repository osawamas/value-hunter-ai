name: VALUE HUNTER v158 OCBC official bank balance row discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/sgx_ocbc_balance_rows_v158.py'
      - 'SGX_PDF_connection_probe/test_sgx_ocbc_balance_rows_v158.py'
      - '.github/workflows/value-hunter-v158.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v158
  cancel-in-progress: false
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract bounded bank balance context from SGX primary PDF
        run: |
          python -m pip install --quiet 'pymupdf>=1.24,<1.28'
          cd SGX_PDF_connection_probe
          python -m unittest -v test_sgx_ocbc_balance_rows_v158
          cd ..
          python SGX_PDF_connection_probe/sgx_ocbc_balance_rows_v158.py --manifest docs/data/sgx-ocbc-2026q3-pdfs-v145.json --output docs/data/sgx-ocbc-balance-rows-v158.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/data/sgx-ocbc-balance-rows-v158.json').read_text())
          assert x['status']=='OCBC_PRIMARY_BANK_BALANCE_ROWS_EXTRACTED_RESEARCH_ONLY',x['error']
          assert x['record']['precise_balance_sheet_independently_verified'] is False
          assert json.loads(Path('docs/data/latest.json').read_text())['ranking_eligible_count']==0
          PY
      - name: Commit source-bound balance table clues only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python SGX_PDF_connection_probe/sgx_ocbc_balance_rows_v158.py --manifest docs/data/sgx-ocbc-2026q3-pdfs-v145.json --output docs/data/sgx-ocbc-balance-rows-v158.json
            git add docs/data/sgx-ocbc-balance-rows-v158.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(v158): OCBC official bank balance statement table structure research'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1
