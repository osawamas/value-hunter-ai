name: SGX S68 integrated financial audit v14
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pymupdf
      - name: Run v14 integration tests
        run: python -m unittest discover -s SGX_PDF_connection_probe -p 'test_integrated_financial_v14.py' -v
      - name: Extract S68 income statement from live PDF
        run: python SGX_PDF_connection_probe/probe.py
      - name: Fetch PDF candidates
        run: python SGX_PDF_connection_probe/batch_probe.py
      - name: Verify arithmetic
        run: python SGX_PDF_connection_probe/financial_audit_v10.py batch_results
      - name: Verify headings
        run: python SGX_PDF_connection_probe/scope_heading_v12.py
      - name: Verify consolidated balance sheet
        run: python SGX_PDF_connection_probe/consolidated_audit_v13.py batch_results
      - name: Bring verified S68 income JSON into batch results
        run: |
          test -f results/S68_verified_financials.json
          mkdir -p batch_results
          cp results/S68_verified_financials.json batch_results/S68_verified_financials.json
      - name: Integrate income and balance sheets
        run: python SGX_PDF_connection_probe/integrated_financial_v14.py batch_results
      - name: Upload results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgx-batch-v14-results
          path: |
            batch_results/
            results/
          if-no-files-found: warn
