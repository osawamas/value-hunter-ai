name: VALUE HUNTER v114 actual intraday secondary SGX bank chart probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/sgx_intraday_v114.py'
      - 'SGX_PDF_connection_probe/test_sgx_intraday_v114.py'
      - '.github/workflows/value-hunter-v114.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v114
  cancel-in-progress: false
jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Negative tests for provider identity, intraday time and fail-close
        run: |
          cd SGX_PDF_connection_probe
          python -m unittest -v test_sgx_intraday_v114
      - name: Fetch and categorize 5m charts without treating bars as trade executions
        run: |
          python SGX_PDF_connection_probe/sgx_intraday_v114.py --output docs/data/sgx-bank-intraday-v114.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("docs/data/sgx-bank-intraday-v114.json").read_text())
          assert x["official_exchange_trade_data_count"]==0
          assert x["promoted_to_financial_feed"] is False
          assert x["ranking_eligible"] is False
          for r in x["records"]:
              if r["record"]:
                  assert r["record"]["bar_timestamp_is_verified_trade_time"] is False
                  assert r["record"]["eligible_for_market_cap_per_pbr"] is False
          f=json.loads(Path("docs/data/latest.json").read_text())
          assert f["ranking_eligible_count"]==0
          print("Intraday chart observations",x["retrieved_intraday_chart_count"])
          PY
      - name: Commit separate research-only intraday JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/sgx-bank-intraday-v114.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(v114): secondary 5-minute SGX bank bars'
            git push
          fi
