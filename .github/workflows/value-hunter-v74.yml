name: VALUE HUNTER bank shareholding source discovery v74
on:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/bank_share_probe_v74.py'
      - '.github/workflows/value-hunter-v74.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        symbol: [O39, U11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Locate dated treasury-share evidence only
        run: python SGX_PDF_connection_probe/bank_share_probe_v74.py --symbol ${{ matrix.symbol }} --output v74-share/${{ matrix.symbol }}.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-shares-v74-${{ matrix.symbol }}
          path: v74-share/
          if-no-files-found: warn
