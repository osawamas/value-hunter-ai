name: JPX evidence audit regression

on:
  push:
    paths:
      - 'scripts/audit_jpx_financial_evidence.py'
      - 'tests/test_audit_jpx_financial_evidence.py'
      - '.github/workflows/jpx-evidence-audit.yml'
  pull_request:
    paths:
      - 'scripts/audit_jpx_financial_evidence.py'
      - 'tests/test_audit_jpx_financial_evidence.py'
      - '.github/workflows/jpx-evidence-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run evidence audit regressions
        run: python -m unittest discover -s tests -p test_audit_jpx_financial_evidence.py -v
