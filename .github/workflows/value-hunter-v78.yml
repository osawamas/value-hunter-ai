name: VALUE HUNTER 3Q26 table layout v78
on:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/bank_q3_table_probe_v78.py'
      - '.github/workflows/value-hunter-v78.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        symbol: [D05, O39, U11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Capture exact table row order from issuer 3Q26 PDF
        run: python SGX_PDF_connection_probe/bank_q3_table_probe_v78.py --symbol ${{ matrix.symbol }}
