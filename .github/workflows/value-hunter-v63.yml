name: VALUE HUNTER DBS bank statements probe v63
on:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/d05_bank_financial_probe_v63.py'
      - '.github/workflows/value-hunter-v63.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Locate actual DBS Group FY2025 bank financial statements
        run: python SGX_PDF_connection_probe/d05_bank_financial_probe_v63.py --output d05-v63/bank_statement_pages.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d05-bank-financial-probe-v63
          path: d05-v63/
          if-no-files-found: warn
