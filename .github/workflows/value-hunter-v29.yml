      - '.github/workflows/value-hunter-v29.yml'

permissions:
  contents: write

concurrency:
  group: value-hunter-v29-dashboard
  cancel-in-progress: false

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF parser
        run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Run unit tests and JavaScript syntax check
        run: |
          cd SGX_PDF_connection_probe
          python -m unittest -v \
                      test_value_hunter_v27.py test_value_hunter_v28.py test_g13_balance_v42.py \
                      test_balance_details_v43.py test_operating_evidence_v41.py \
                      test_value_hunter_s63_crosscheck_v40.py test_value_hunter_web_v29.py \
                      test_sgx_universe_v30.py test_s63_audited_pdf_v32.py \
                      test_value_hunter_quality_v33.py test_value_hunter_history_v34.py \
                      test_s63_share_snapshot_v36.py \
                      test_official_sources_v44.py test_share_provenance_v45.py test_s68_shareholding_v46.py test_public_shares_v47.py test_g13_shareholding_v48.py \
                      test_s68_annual_crosscheck_v50.py test_s68_crosscheck_merge_v50.py test_public_quality_v52.py test_public_freshness_v53.py test_s68_parent_equity_v54.py \
                      test_s68_parent_merge_v54.py test_official_http_v57.py test_pdf_reuse_v58.py test_annual_identity_v59.py test_d05_shareholding_v62.py \
            test_d05_bank_income_v63.py test_d05_bank_balance_v64.py test_d05_bank_bundle_v65.py \
            test_o39_bank_summary_v67.py test_u11_bank_summary_v68.py test_bank_summary_publish_v69.py \
            test_bank_audited_group_v70.py test_bank_audited_publish_v71.py test_bank_indicators_v72.py test_bank_financial_state_v73.py \
            test_bank_historical_shares_v75.py test_bank_historical_share_publish_v76.py \
            test_bank_q3_financials_v79.py test_bank_q3_publish_v80.py \
            test_bank_q3_yoy_v81.py test_bank_q3_yoy_publish_v82.py test_bank_share_leads_v83.py test_sgx_primary_buyback_v84.py test_u11_primary_publish_v86.py test_bank_share_leads_v87.py test_u11_nov12_publish_v89.py
          cd ..
          node --check docs/app.js
          node tests/history-v38.test.js
          node tests/freshness-v39.test.js
      - name: Build live financial comparison
        if: github.event_name != 'pull_request'
        env:
          SGX_V18_OUTPUT: ${{ github.workspace }}/sgx_v18_results
        run: |
          python SGX_PDF_connection_probe/sgx_integrated_v18.py
          python SGX_PDF_connection_probe/g13_balance_v42.py --original sgx_v18_results/G13_financial_v18.json --output sgx_v18_results/G13_balance_v42.json
          python - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path("sgx_v18_results/G13_balance_v42.json").read_text(encoding="utf-8"))
          report={key:raw.get(key) for key in ("symbol","status","source_url","pdf_sha256","error","checks","page_pdf_number")}
          report["parent_equity_candidate"] = raw.get("metrics",{}).get("parent_equity",{})
          dest=Path("docs/data/g13_balance_status.json")
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("\n### G13 balance audit\n")
              out.write("- status: "+str(raw.get("status"))+"\n")
              out.write("- error: "+str(raw.get("error"))+"\n")
          PY
          python SGX_PDF_connection_probe/s63_audited_pdf_v32.py --output s63_v32_results/audited_report.json
          python SGX_PDF_connection_probe/s68_shareholding_v46.py --verified-pdf-copy "$RUNNER_TEMP/s68_annual_fy2026_verified.pdf" --output sgx_v18_results/S68_shares_v46.json
          python SGX_PDF_connection_probe/g13_shareholding_v48.py --output sgx_v18_results/G13_shares_v48.json
          python SGX_PDF_connection_probe/g13_treasury_v44.py --output sgx_v18_results/G13_treasury_v44.json
          python SGX_PDF_connection_probe/s68_official_pdf_v44.py --verified-pdf-copy "$RUNNER_TEMP/s68_fy2026_verified.pdf" --output sgx_v18_results/S68_official_v44.json
          python SGX_PDF_connection_probe/s68_parent_equity_v54.py --offline-pdf "$RUNNER_TEMP/s68_fy2026_verified.pdf" --output sgx_v18_results/S68_parent_v54.json
          python SGX_PDF_connection_probe/value_hunter_v19.py --s68-parent sgx_v18_results/S68_parent_v54.json --s68-official sgx_v18_results/S68_official_v44.json --v18-dir sgx_v18_results --s68 SGX_PDF_connection_probe/fixtures/S68_FY2026_integrated_v14.json --g13-balance sgx_v18_results/G13_balance_v42.json --s63 s63_v32_results/audited_report.json --output value_hunter_results
          python SGX_PDF_connection_probe/value_hunter_market_v20.py --financials value_hunter_results/value_hunter_financials.json --output value_hunter_market_results
          python SGX_PDF_connection_probe/value_hunter_v25.py --g13-shares sgx_v18_results/G13_shares_v48.json --s68-shares sgx_v18_results/S68_shares_v46.json --financials value_hunter_results/value_hunter_financials.json --market value_hunter_market_results/market_valuation_v20.json --output value_hunter_v25_results
          python SGX_PDF_connection_probe/s68_annual_crosscheck_v50.py --offline-pdf "$RUNNER_TEMP/s68_annual_fy2026_verified.pdf" --output value_hunter_v27_results/s68_crosscheck_v50.json
          python SGX_PDF_connection_probe/value_hunter_v27.py --s68-annual-shares sgx_v18_results/S68_shares_v46.json --s68-crosscheck value_hunter_v27_results/s68_crosscheck_v50.json --financials value_hunter_results/value_hunter_financials.json --output value_hunter_v27_results
          python SGX_PDF_connection_probe/value_hunter_s63_crosscheck_v40.py --financials value_hunter_results/value_hunter_financials.json --audit value_hunter_v27_results/audit_v27.json --output value_hunter_v27_results/audit_v27.json
          python SGX_PDF_connection_probe/value_hunter_v28.py --financials value_hunter_results/value_hunter_financials.json --valuation value_hunter_v25_results/valuation_v25.json --audit value_hunter_v27_results/audit_v27.json --universe SGX_PDF_connection_probe/sgx_universe_v30.json --output value_hunter_v28_results
      - name: Validate and publish dashboard JSON
        if: github.event_name != 'pull_request'
        run: |
          python SGX_PDF_connection_probe/value_hunter_web_v29.py --source value_hunter_v28_results/comparison_v28.json --output docs/data/latest.json
          python SGX_PDF_connection_probe/value_hunter_quality_v33.py --input docs/data/latest.json --output docs/data/latest.json
          # Banking source is optional: an issuer PDF denial must not break
          # the existing SGX data or fabricate bank valuations.
          if python SGX_PDF_connection_probe/d05_bank_bundle_v65.py --output d05-v65/bundle.json; then
            python SGX_PDF_connection_probe/d05_bank_publish_v65.py --feed docs/data/latest.json --bundle d05-v65/bundle.json --output docs/data/latest.json
          else
            echo "DBS banking report unavailable; keeping D05 banking evidence absent." >> "$GITHUB_STEP_SUMMARY"
          fi
          # More banks stay in separate Group summary fields. Failed issuer
          # retrieval is nonblocking and NEVER produces invented valuations.
          if python SGX_PDF_connection_probe/o39_bank_summary_v67.py --verified-pdf-copy "$RUNNER_TEMP/o39_verified_2025.pdf" --output o39-v67/report.json; then
            python SGX_PDF_connection_probe/bank_summary_publish_v69.py --input docs/data/latest.json --source o39-v67/report.json --output docs/data/latest.json
            if python SGX_PDF_connection_probe/bank_audited_group_v70.py --symbol O39 --offline-pdf "$RUNNER_TEMP/o39_verified_2025.pdf" --output o39-v70/audited.json; then
              python SGX_PDF_connection_probe/bank_audited_publish_v71.py --feed docs/data/latest.json --audit o39-v70/audited.json --output docs/data/latest.json
            else
              echo "O39 audited Group crosscheck unavailable; annual summary remains separate." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "OCBC issuer summary unavailable; no O39 bank metrics promoted." >> "$GITHUB_STEP_SUMMARY"
          fi
          if python SGX_PDF_connection_probe/u11_bank_summary_v68.py --verified-pdf-copy "$RUNNER_TEMP/u11_verified_2025.pdf" --output u11-v68/report.json; then
            python SGX_PDF_connection_probe/bank_summary_publish_v69.py --input docs/data/latest.json --source u11-v68/report.json --output docs/data/latest.json
            if python SGX_PDF_connection_probe/bank_audited_group_v70.py --symbol U11 --offline-pdf "$RUNNER_TEMP/u11_verified_2025.pdf" --output u11-v70/audited.json; then
              python SGX_PDF_connection_probe/bank_audited_publish_v71.py --feed docs/data/latest.json --audit u11-v70/audited.json --output docs/data/latest.json
            else
              echo "U11 audited Group crosscheck unavailable; annual summary remains separate." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "UOB issuer summary unavailable; no U11 bank metrics promoted." >> "$GITHUB_STEP_SUMMARY"
          fi
          python SGX_PDF_connection_probe/bank_indicators_v72.py --input docs/data/latest.json --output docs/data/latest.json
          python SGX_PDF_connection_probe/bank_financial_state_v73.py --input docs/data/latest.json --output docs/data/latest.json
          # Preserve issuer dated February 2026 share counts as historical-only
          # evidence. Never put them in top-level current shares or valuations.
          if test -f "$RUNNER_TEMP/o39_verified_2025.pdf" && python SGX_PDF_connection_probe/bank_historical_shares_v75.py --symbol O39 --offline-pdf "$RUNNER_TEMP/o39_verified_2025.pdf" --output bank-shares-v75/O39.json; then
            python SGX_PDF_connection_probe/bank_historical_share_publish_v76.py --feed docs/data/latest.json --source bank-shares-v75/O39.json --output docs/data/latest.json
          else
            echo "O39 dated treasury share evidence not available; current shares stay unknown." >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$RUNNER_TEMP/u11_verified_2025.pdf" && python SGX_PDF_connection_probe/bank_historical_shares_v75.py --symbol U11 --offline-pdf "$RUNNER_TEMP/u11_verified_2025.pdf" --output bank-shares-v75/U11.json; then
            python SGX_PDF_connection_probe/bank_historical_share_publish_v76.py --feed docs/data/latest.json --source bank-shares-v75/U11.json --output docs/data/latest.json
          else
            echo "U11 dated treasury share evidence not available; current shares stay unknown." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Q3 is a three-month result; 9M is cumulative. Preserve FY2025
          # audited Group figures and all market/valuation nulls separately.
          for symbol in D05 O39 U11; do
            if python SGX_PDF_connection_probe/bank_q3_financials_v79.py --symbol "$symbol" --verified-pdf-copy "$RUNNER_TEMP/$symbol-q3-2026.pdf" --output "bank-quarter-v79/$symbol.json"; then
              python SGX_PDF_connection_probe/bank_q3_publish_v80.py --feed docs/data/latest.json --issuer-result "bank-quarter-v79/$symbol.json" --output docs/data/latest.json
              # Extract comparable prior-year values from the same verified issuer PDF bytes.
              if python SGX_PDF_connection_probe/bank_q3_yoy_v81.py --symbol "$symbol" --offline-pdf "$RUNNER_TEMP/$symbol-q3-2026.pdf" --output "bank-yoy-v81/$symbol.json"; then
                python SGX_PDF_connection_probe/bank_q3_yoy_publish_v82.py --feed docs/data/latest.json --source "bank-yoy-v81/$symbol.json" --output docs/data/latest.json
              else
                echo "$symbol same-period YoY comparison unavailable, current Q3/9M remains independently labelled." >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "$symbol 3Q26 source unavailable or regression changed; no Q3 data promoted." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          python SGX_PDF_connection_probe/bank_share_leads_v83.py --input docs/data/latest.json --output docs/data/latest.json
          python SGX_PDF_connection_probe/bank_share_leads_v87.py --input docs/data/latest.json --output docs/data/latest.json
          # Only an actual directly fetched SGX September filing can be
          # published, and only as historical evidence; later share events
          # remain unverified, without affecting price or PER/PBR.
          if python SGX_PDF_connection_probe/u11_primary_snapshot_v85.py --output primary-sgx-v85/u11.json; then
            python SGX_PDF_connection_probe/u11_primary_publish_v86.py --feed docs/data/latest.json --source primary-sgx-v85/u11.json --output docs/data/latest.json
          else
            echo "Primary SGX Sep-2026 UOB announcement unavailable; keep previous provenance state." >> "$GITHUB_STEP_SUMMARY"
          fi
          # UOB 12-Nov has a direct SGX original. Preserve it as dated
          # history and leave the 13-Nov SGXNet secondary lead unverified.
          if python SGX_PDF_connection_probe/u11_nov12_primary_v88.py --output primary-sgx-v88/u11-nov12.json; then
            python SGX_PDF_connection_probe/u11_nov12_publish_v89.py --feed docs/data/latest.json --source primary-sgx-v88/u11-nov12.json --output docs/data/latest.json
          else
            echo "SGX UOB 12-Nov source unavailable; keep dated official history absent." >> "$GITHUB_STEP_SUMMARY"
          fi
          python SGX_PDF_connection_probe/value_hunter_history_v34.py --source docs/data/latest.json --history-dir docs/data/history
          cat value_hunter_v28_results/summary_v28.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit updated public feed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if ! git diff --quiet -- docs/data/latest.json docs/data/g13_balance_status.json || [ -n "$(git ls-files --others --exclude-standard docs/data/history docs/data/g13_balance_status.json)" ] || ! git diff --quiet -- docs/data/history; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A docs/data/latest.json docs/data/history docs/data/g13_balance_status.json
            git commit -m "data: refresh verified-status SGX dashboard feed"
            # Remote main may advance while PDF parsing runs. Never force-push.
            for attempt in 1 2 3; do
              # This commit contains generated docs/data only. Resolve competing
              # generated history JSON in favor of this more recently built run.
              git -c rebase.backend=merge pull --rebase -X theirs origin main
              if git push origin HEAD:main; then
                echo "Feed pushed on attempt $attempt."
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Feed push could not be fast-forwarded after 3 retries"
                exit 1
              fi
            done
          else
            echo "Feed unchanged."
          fi
      - name: Upload audit trail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-hunter-v29-diagnostics
          path: |
            sgx_v18_results/
            s63_v32_results/
            value_hunter_results/
            value_hunter_market_results/
            value_hunter_v25_results/
            value_hunter_v27_results/
            value_hunter_v28_results/
          if-no-files-found: warn
