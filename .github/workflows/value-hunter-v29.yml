  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/test_operating_evidence_v41.py'
      - 'SGX_PDF_connection_probe/g13_balance_v42.py'
      - 'SGX_PDF_connection_probe/test_g13_balance_v42.py test_balance_details_v43.py'
      - 'SGX_PDF_connection_probe/s68_official_pdf_v44.py'
      - 'SGX_PDF_connection_probe/g13_treasury_v44.py'
      - 'SGX_PDF_connection_probe/test_official_sources_v44.py'
      - 'SGX_PDF_connection_probe/test_share_provenance_v45.py'
      - 'SGX_PDF_connection_probe/s68_shareholding_v46.py'
      - 'SGX_PDF_connection_probe/test_s68_shareholding_v46.py'
      - 'SGX_PDF_connection_probe/test_public_shares_v47.py'
      - 'SGX_PDF_connection_probe/g13_shareholding_v48.py'
      - 'SGX_PDF_connection_probe/test_g13_shareholding_v48.py'
      - 'SGX_PDF_connection_probe/s68_annual_crosscheck_v50.py'
      - 'SGX_PDF_connection_probe/test_s68_annual_crosscheck_v50.py'
      - 'SGX_PDF_connection_probe/test_s68_crosscheck_merge_v50.py'
      - 'SGX_PDF_connection_probe/test_public_quality_v52.py'
      - 'SGX_PDF_connection_probe/test_public_freshness_v53.py'
      - 'SGX_PDF_connection_probe/value_hunter_v25.py'
      - 'SGX_PDF_connection_probe/value_hunter_v19.py'
      - 'SGX_PDF_connection_probe/value_hunter_v28.py'
      - 'SGX_PDF_connection_probe/value_hunter_s63_crosscheck_v40.py'
      - 'SGX_PDF_connection_probe/test_value_hunter_s63_crosscheck_v40.py'
      - 'SGX_PDF_connection_probe/test_balance_details_v43.py'
      - 'SGX_PDF_connection_probe/value_hunter_web_v29.py'
      - 'SGX_PDF_connection_probe/value_hunter_quality_v33.py'
      - 'SGX_PDF_connection_probe/test_s63_share_snapshot_v36.py'
      - 'SGX_PDF_connection_probe/value_hunter_shares_v21.py'
      - 'SGX_PDF_connection_probe/value_hunter_history_v34.py'
      - 'SGX_PDF_connection_probe/test_value_hunter_history_v34.py'
      - 'SGX_PDF_connection_probe/test_value_hunter_quality_v33.py'
      - 'SGX_PDF_connection_probe/test_value_hunter_web_v29.py'
      - 'SGX_PDF_connection_probe/value_hunter_quality_v33.py'
      - 'SGX_PDF_connection_probe/test_value_hunter_quality_v33.py'
      - 'SGX_PDF_connection_probe/value_hunter_history_v34.py'
      - 'SGX_PDF_connection_probe/test_value_hunter_history_v34.py'
      - 'SGX_PDF_connection_probe/value_hunter_shares_v21.py'
      - 'SGX_PDF_connection_probe/test_s63_share_snapshot_v36.py'
      - 'SGX_PDF_connection_probe/sgx_universe_v30.py'
      - 'SGX_PDF_connection_probe/sgx_universe_v30.json'
      - 'SGX_PDF_connection_probe/s63_audited_pdf_v32.py'
      - 'SGX_PDF_connection_probe/test_s63_audited_pdf_v32.py'
      - 'SGX_PDF_connection_probe/test_sgx_universe_v30.py'
      - 'docs/index.html'
      - 'docs/app.js'
      - 'tests/history-v38.test.js'
      - 'tests/freshness-v39.test.js'
      - 'docs/style.css'
      - '.github/workflows/value-hunter-v29.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1-5'
  pull_request:
    paths:
      - 'SGX_PDF_connection_probe/test_operating_evidence_v41.py'
      - 'SGX_PDF_connection_probe/g13_balance_v42.py'
      - 'SGX_PDF_connection_probe/test_g13_balance_v42.py'
      - 'SGX_PDF_connection_probe/test_balance_details_v43.py'
      - 'SGX_PDF_connection_probe/value_hunter_v19.py'
      - 'SGX_PDF_connection_probe/value_hunter_v28.py'
      - 'SGX_PDF_connection_probe/value_hunter_s63_crosscheck_v40.py'
      - 'SGX_PDF_connection_probe/test_value_hunter_s63_crosscheck_v40.py'
      - 'SGX_PDF_connection_probe/test_balance_details_v43.py'
      - 'SGX_PDF_connection_probe/value_hunter_web_v29.py'
      - 'SGX_PDF_connection_probe/test_value_hunter_web_v29.py'
      - 'SGX_PDF_connection_probe/sgx_universe_v30.py'
      - 'SGX_PDF_connection_probe/sgx_universe_v30.json'
      - 'SGX_PDF_connection_probe/s63_audited_pdf_v32.py'
      - 'SGX_PDF_connection_probe/test_s63_audited_pdf_v32.py'
      - 'SGX_PDF_connection_probe/test_sgx_universe_v30.py'
      - 'docs/**'
      - 'tests/history-v38.test.js'
      - '.github/workflows/value-hunter-v29.yml'

permissions:
  contents: write

concurrency:
  group: value-hunter-v29-dashboard
  cancel-in-progress: false

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF parser
        run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Run unit tests and JavaScript syntax check
        run: |
          cd SGX_PDF_connection_probe
          python -m unittest -v test_value_hunter_v27.py test_value_hunter_v28.py test_g13_balance_v42.py test_balance_details_v43.py test_operating_evidence_v41.py test_value_hunter_s63_crosscheck_v40.py test_value_hunter_web_v29.py test_sgx_universe_v30.py test_s63_audited_pdf_v32.py test_value_hunter_quality_v33.py test_value_hunter_history_v34.py test_s63_share_snapshot_v36.py
          cd ..
          node --check docs/app.js
          node tests/history-v38.test.js
          node tests/freshness-v39.test.js
      - name: Build live financial comparison
        if: github.event_name != 'pull_request'
        env:
          SGX_V18_OUTPUT: ${{ github.workspace }}/sgx_v18_results
        run: |
          python SGX_PDF_connection_probe/sgx_integrated_v18.py
          python SGX_PDF_connection_probe/g13_balance_v42.py --original sgx_v18_results/G13_financial_v18.json --output sgx_v18_results/G13_balance_v42.json
          python - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path("sgx_v18_results/G13_balance_v42.json").read_text(encoding="utf-8"))
          report={key:raw.get(key) for key in ("symbol","status","source_url","pdf_sha256","error","checks","page_pdf_number")}
          report["parent_equity_candidate"] = raw.get("metrics",{}).get("parent_equity",{})
          dest=Path("docs/data/g13_balance_status.json")
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("\n### G13 balance audit\n")
              out.write("- status: "+str(raw.get("status"))+"\n")
              out.write("- error: "+str(raw.get("error"))+"\n")
          PY
          python SGX_PDF_connection_probe/s63_audited_pdf_v32.py --output s63_v32_results/audited_report.json
          python SGX_PDF_connection_probe/s68_shareholding_v46.py --output sgx_v18_results/S68_shares_v46.json
          python SGX_PDF_connection_probe/g13_shareholding_v48.py --output sgx_v18_results/G13_shares_v48.json
          python SGX_PDF_connection_probe/g13_treasury_v44.py --output sgx_v18_results/G13_treasury_v44.json
          python SGX_PDF_connection_probe/s68_official_pdf_v44.py --output sgx_v18_results/S68_official_v44.json
          python SGX_PDF_connection_probe/value_hunter_v19.py --s68-official sgx_v18_results/S68_official_v44.json --v18-dir sgx_v18_results --s68 SGX_PDF_connection_probe/fixtures/S68_FY2026_integrated_v14.json --g13-balance sgx_v18_results/G13_balance_v42.json --s63 s63_v32_results/audited_report.json --output value_hunter_results
          python SGX_PDF_connection_probe/value_hunter_market_v20.py --financials value_hunter_results/value_hunter_financials.json --output value_hunter_market_results
          python SGX_PDF_connection_probe/value_hunter_v25.py --g13-shares sgx_v18_results/G13_shares_v48.json --s68-shares sgx_v18_results/S68_shares_v46.json --financials value_hunter_results/value_hunter_financials.json --market value_hunter_market_results/market_valuation_v20.json --output value_hunter_v25_results
          python SGX_PDF_connection_probe/s68_annual_crosscheck_v50.py --output value_hunter_v27_results/s68_crosscheck_v50.json
          python SGX_PDF_connection_probe/value_hunter_v27.py --s68-crosscheck value_hunter_v27_results/s68_crosscheck_v50.json --financials value_hunter_results/value_hunter_financials.json --output value_hunter_v27_results
          python SGX_PDF_connection_probe/value_hunter_s63_crosscheck_v40.py --financials value_hunter_results/value_hunter_financials.json --audit value_hunter_v27_results/audit_v27.json --output value_hunter_v27_results/audit_v27.json
          python SGX_PDF_connection_probe/value_hunter_v28.py --financials value_hunter_results/value_hunter_financials.json --valuation value_hunter_v25_results/valuation_v25.json --audit value_hunter_v27_results/audit_v27.json --universe SGX_PDF_connection_probe/sgx_universe_v30.json --output value_hunter_v28_results
      - name: Validate and publish dashboard JSON
        if: github.event_name != 'pull_request'
        run: |
          python SGX_PDF_connection_probe/value_hunter_web_v29.py --source value_hunter_v28_results/comparison_v28.json --output docs/data/latest.json
          python SGX_PDF_connection_probe/value_hunter_quality_v33.py --input docs/data/latest.json --output docs/data/latest.json
          python SGX_PDF_connection_probe/value_hunter_history_v34.py --source docs/data/latest.json --history-dir docs/data/history
          cat value_hunter_v28_results/summary_v28.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit updated public feed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if ! git diff --quiet -- docs/data/latest.json docs/data/g13_balance_status.json || [ -n "$(git ls-files --others --exclude-standard docs/data/history docs/data/g13_balance_status.json)" ] || ! git diff --quiet -- docs/data/history; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A docs/data/latest.json docs/data/history docs/data/g13_balance_status.json
            git commit -m "data: refresh verified-status SGX dashboard feed"
            # Remote main may advance while PDF parsing runs. Never force-push.
            for attempt in 1 2 3; do
              # This commit contains generated docs/data only. Resolve competing
              # generated history JSON in favor of this more recently built run.
              git -c rebase.backend=merge pull --rebase -X theirs origin main
              if git push origin HEAD:main; then
                echo "Feed pushed on attempt $attempt."
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Feed push could not be fast-forwarded after 3 retries"
                exit 1
              fi
            done
          else
            echo "Feed unchanged."
          fi
      - name: Upload audit trail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-hunter-v29-diagnostics
          path: |
            sgx_v18_results/
            s63_v32_results/
            value_hunter_results/
            value_hunter_market_results/
            value_hunter_v25_results/
            value_hunter_v27_results/
            value_hunter_v28_results/
          if-no-files-found: warn
