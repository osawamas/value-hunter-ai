name: VALUE HUNTER SGX dashboard data refresh v29

on:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/value_hunter_web_v29.py'
      - 'SGX_PDF_connection_probe/test_value_hunter_web_v29.py'
      - 'docs/index.html'
      - 'docs/app.js'
      - 'docs/style.css'
      - '.github/workflows/value-hunter-v29.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1-5'
  pull_request:
    paths:
      - 'SGX_PDF_connection_probe/value_hunter_web_v29.py'
      - 'SGX_PDF_connection_probe/test_value_hunter_web_v29.py'
      - 'docs/**'
      - '.github/workflows/value-hunter-v29.yml'

permissions:
  contents: write

concurrency:
  group: value-hunter-v29-dashboard
  cancel-in-progress: false

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF parser
        run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Run unit tests and JavaScript syntax check
        run: |
          cd SGX_PDF_connection_probe
          python -m unittest -v test_value_hunter_v27.py test_value_hunter_v28.py test_value_hunter_web_v29.py
          cd ..
          node --check docs/app.js
      - name: Build live financial comparison
        if: github.event_name != 'pull_request'
        env:
          SGX_V18_OUTPUT: ${{ github.workspace }}/sgx_v18_results
        run: |
          python SGX_PDF_connection_probe/sgx_integrated_v18.py
          python SGX_PDF_connection_probe/value_hunter_v19.py --v18-dir sgx_v18_results --s68 SGX_PDF_connection_probe/fixtures/S68_FY2026_integrated_v14.json --output value_hunter_results
          python SGX_PDF_connection_probe/value_hunter_market_v20.py --financials value_hunter_results/value_hunter_financials.json --output value_hunter_market_results
          python SGX_PDF_connection_probe/value_hunter_v25.py --financials value_hunter_results/value_hunter_financials.json --market value_hunter_market_results/market_valuation_v20.json --output value_hunter_v25_results
          python SGX_PDF_connection_probe/value_hunter_v27.py --financials value_hunter_results/value_hunter_financials.json --output value_hunter_v27_results
          python SGX_PDF_connection_probe/value_hunter_v28.py --financials value_hunter_results/value_hunter_financials.json --valuation value_hunter_v25_results/valuation_v25.json --audit value_hunter_v27_results/audit_v27.json --output value_hunter_v28_results
      - name: Validate and publish dashboard JSON
        if: github.event_name != 'pull_request'
        run: |
          python SGX_PDF_connection_probe/value_hunter_web_v29.py --source value_hunter_v28_results/comparison_v28.json --output docs/data/latest.json
          cat value_hunter_v28_results/summary_v28.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit updated public feed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if ! git diff --quiet -- docs/data/latest.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/data/latest.json
            git commit -m "data: refresh verified-status SGX dashboard feed"
            git push origin HEAD:main
          else
            echo "Feed unchanged."
          fi
      - name: Upload audit trail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-hunter-v29-diagnostics
          path: |
            sgx_v18_results/
            value_hunter_results/
            value_hunter_market_results/
            value_hunter_v25_results/
            value_hunter_v27_results/
            value_hunter_v28_results/
          if-no-files-found: warn

  deploy-dashboard:
    if: github.event_name != 'pull_request'
    needs: refresh-dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Enable GitHub Pages for workflow deployments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' > /tmp/pages-build-type 2>/dev/null; then
            mode="$(cat /tmp/pages-build-type)"
            if [ "$mode" != "workflow" ]; then
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
            fi
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Print published URL
        run: echo "公開サイト: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
