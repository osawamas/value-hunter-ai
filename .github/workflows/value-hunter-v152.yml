name: VALUE HUNTER v152 OCBC exact Q3 9M profit rows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/sgx_ocbc_exact_profit_v152.py'
      - 'SGX_PDF_connection_probe/test_sgx_ocbc_exact_profit_v152.py'
      - '.github/workflows/value-hunter-v152.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v152
  cancel-in-progress: false
jobs:
  exact-amounts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test ambiguous or shifted banking financial rows
        run: |
          python -m pip install --quiet 'pymupdf>=1.24,<1.28'
          cd SGX_PDF_connection_probe
          python -m unittest -v test_sgx_ocbc_exact_profit_v152
      - name: Recalculate actual quarterly and nine-month profit from SGX PDF
        run: |
          python SGX_PDF_connection_probe/sgx_ocbc_exact_profit_v152.py --originals docs/data/sgx-ocbc-2026q3-pdfs-v145.json --rounded docs/data/sgx-ocbc-2026q3-bank-profit-v146.json --output docs/data/sgx-ocbc-exact-profit-v152.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('docs/data/sgx-ocbc-exact-profit-v152.json').read_text())
          assert p['status']=='OCBC_Q3_EXACT_PROFIT_ROWS_PRIMARY_PDF_RECONCILED',p['error']
          a=p['record']
          assert a['group_profit_3q26_sgd_millions']==2042
          assert a['group_profit_9m26_sgd_millions']==6237
          assert a['ranking_eligible'] is False
          assert json.loads(Path('docs/data/latest.json').read_text())['ranking_eligible_count']==0
          PY
      - name: Save precise separate historical banking evidence with retries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python SGX_PDF_connection_probe/sgx_ocbc_exact_profit_v152.py --originals docs/data/sgx-ocbc-2026q3-pdfs-v145.json --rounded docs/data/sgx-ocbc-2026q3-bank-profit-v146.json --output docs/data/sgx-ocbc-exact-profit-v152.json
            git add docs/data/sgx-ocbc-exact-profit-v152.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(v152): OCBC 2026Q3 precise issuer bank profit extracted from SGX'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1
