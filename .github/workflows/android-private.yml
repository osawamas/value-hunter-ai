name: VALUE HUNTER Android private preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-private/**'
      - 'docs/data/android-s63-shares.json'
      - '.github/workflows/android-private.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android-private
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - name: Verify stock calculations and merge the disclosure asset
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:mergeDebugAssets
      - name: Confirm the private APK was built (do not publish it)
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify the packaged disclosure asset matches the ledger
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/android-s63-shares.json > "$RUNNER_TEMP/packaged-s63-shares.json"
          cmp ../docs/data/android-s63-shares.json "$RUNNER_TEMP/packaged-s63-shares.json"
