name: VALUE HUNTER Android private preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-private/**'
      - '.github/workflows/android-private.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android-private
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - name: Build APK and verify the stock screen
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
