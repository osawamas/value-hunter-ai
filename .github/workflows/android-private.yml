name: VALUE HUNTER Android private preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-private/**'
      - 'docs/data/android-s63-shares.json'
      - '.github/workflows/android-private.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android-private
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify JPX acquisition audit classification
        run: python -m unittest discover -s tools -p 'test_jpx_financial_audit_gaps.py' -v
      - name: Verify Android unit tests without assembling an APK
        run: gradle --no-daemon :app:testDebugUnitTest
