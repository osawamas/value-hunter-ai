name: VALUE HUNTER v161 share quote date coherence safeguards
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/share_quote_date_coherence_v161.py'
      - 'SGX_PDF_connection_probe/test_share_quote_date_coherence_v161.py'
      - '.github/workflows/value-hunter-v161.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v161
  cancel-in-progress: false
jobs:
  dates:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert historical shares never become current
        run: |
          cd SGX_PDF_connection_probe
          python -m unittest -v test_share_quote_date_coherence_v161
      - name: Check actual G13 S63 original share and quote dates
        run: |
          python SGX_PDF_connection_probe/share_quote_date_coherence_v161.py --feed docs/data/latest.json --g13 docs/data/sgx-g13-h1-shares-v127.json --s63 docs/data/sgx-s63-share-delta-v110.json --output docs/data/sgx-share-quote-date-v161.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/data/sgx-share-quote-date-v161.json').read_text())
          assert x['mismatched_reference_date_count']==2
          assert x['ranking_eligible_count']==0
          assert not any(row['same_date_reconciled'] for row in x['records'])
          PY
      - name: Save strict date provenance sidecar on current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python SGX_PDF_connection_probe/share_quote_date_coherence_v161.py --feed docs/data/latest.json --g13 docs/data/sgx-g13-h1-shares-v127.json --s63 docs/data/sgx-s63-share-delta-v110.json --output docs/data/sgx-share-quote-date-v161.json
            git add docs/data/sgx-share-quote-date-v161.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(v161): G13 S63 price-share snapshot time mismatch risk'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
