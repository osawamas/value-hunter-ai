name: VALUE HUNTER 3Q26 comparable bank growth publication v82
on:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/bank_q3_yoy_publish_v82.py'
      - 'SGX_PDF_connection_probe/test_bank_q3_yoy_publish_v82.py'
      - '.github/workflows/value-hunter-v82.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Validate bank source-matched like-for-like period comparison safety
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_bank_q3_financials_v79.py test_bank_q3_publish_v80.py test_bank_q3_yoy_v81.py test_bank_q3_yoy_publish_v82.py
