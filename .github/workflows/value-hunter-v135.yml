name: VALUE HUNTER v135 official SGX page resource discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/sgx_html_assets_v135.py'
      - 'SGX_PDF_connection_probe/test_sgx_html_assets_v135.py'
      - '.github/workflows/value-hunter-v135.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v135
  cancel-in-progress: false
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test public HTML asset discovery
        run: |
          cd SGX_PDF_connection_probe
          python -m unittest -v test_sgx_html_assets_v135
      - name: Retrieve actual official SGX HTML references
        run: |
          python SGX_PDF_connection_probe/sgx_html_assets_v135.py --output docs/data/sgx-html-assets-v135.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("docs/data/sgx-html-assets-v135.json").read_text())
          if x["record"]:
            assert x["record"]["downloadable_master_confirmed"] is False
            assert x["record"]["market_data_fetched"] is False
          feed=json.loads(Path("docs/data/latest.json").read_text())
          assert feed["ranking_eligible_count"]==0
          print(x["status"],x["error"])
          PY
      - name: Commit only public reference paths
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/sgx-html-assets-v135.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(v135): public SGX securities-prices HTML resource paths'
            git push
          fi
