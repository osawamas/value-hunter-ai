name: VALUE HUNTER SGX integrated feed v19
on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 1'
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF parser
        run: pip install 'PyMuPDF>=1.24,<2'
      - name: Run tests
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_value_hunter_v19.py
      - name: Extract G13 and S20 from source PDFs
        env:
          SGX_V18_OUTPUT: ${{ github.workspace }}/sgx_v18_results
        run: python SGX_PDF_connection_probe/sgx_integrated_v18.py
      - name: Build common VALUE HUNTER financial feed
        run: |
          python SGX_PDF_connection_probe/value_hunter_v19.py \
            --v18-dir sgx_v18_results \
            --s68 SGX_PDF_connection_probe/fixtures/S68_FY2026_integrated_v14.json \
            --output value_hunter_results
      - name: Save outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-hunter-v19-results
          path: |
            sgx_v18_results/
            value_hunter_results/
          if-no-files-found: warn
