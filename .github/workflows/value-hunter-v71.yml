name: VALUE HUNTER bank audited cross-document v71
on:
  push:
    branches: [main]
    paths:
      - SGX_PDF_connection_probe/bank_audited_publish_v71.py
      - SGX_PDF_connection_probe/test_bank_audited_publish_v71.py
      - .github/workflows/value-hunter-v71.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Crosscheck same-PDF Group financials and historical highlights
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_bank_audited_group_v70.py test_bank_audited_publish_v71.py
