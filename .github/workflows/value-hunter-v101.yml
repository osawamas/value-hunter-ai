name: VALUE HUNTER company API pagination diagnostic v101
on:
  push:
    branches: [main]
    paths:
      - SGX_PDF_connection_probe/sgx_companies_pagination_v101.py
      - SGX_PDF_connection_probe/test_sgx_companies_pagination_v101.py
      - .github/workflows/value-hunter-v101.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate page2/limit and rate limit fail-closed
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_sgx_companies_pagination_v101.py
      - name: Inspect up to 3 free-tier company directory requests
        run: python SGX_PDF_connection_probe/sgx_companies_pagination_v101.py --output universe-v101/pagination.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universe-pagination-v101
          path: universe-v101/
          if-no-files-found: warn
