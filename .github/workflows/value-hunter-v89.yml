name: VALUE HUNTER official UOB 12-Nov share publication v89
on:
  push:
    branches: [main]
    paths:
      - SGX_PDF_connection_probe/u11_nov12_publish_v89.py
      - SGX_PDF_connection_probe/test_u11_nov12_publish_v89.py
      - .github/workflows/value-hunter-v89.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 12-Nov SGX primary dated shares never become live valuation
        working-directory: SGX_PDF_connection_probe
        run: python -m unittest -v test_u11_nov12_publish_v89.py
