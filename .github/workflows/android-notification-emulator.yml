name: Android silent notifications and history

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-notification-emulator.yml'
      - 'android-private/tools/check_notification_emulator.sh'
      - 'android-private/app/src/main/AndroidManifest.xml'
      - 'android-private/app/src/main/java/jp/valuehunter/privatewatch/Notification*.java'
      - 'android-private/app/src/main/java/jp/valuehunter/privatewatch/ScanWorker.java'
      - 'android-private/app/src/main/java/jp/valuehunter/privatewatch/MainActivity.java'
      - 'android-private/app/src/androidTest/**/Notification*.java'
      - 'android-private/app/src/androidTest/**/JpxPdfGeometryProbe.java'

permissions:
  contents: read

jobs:
  alerts-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - name: Compile application and test APKs
        working-directory: android-private
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify silent delivery, screen wake and history across reboot
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          PROBE_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android-private/tools/check_notification_emulator.sh
