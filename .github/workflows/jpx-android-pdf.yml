name: JPX Android 15 PDF geometry probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jpx-android-pdf.yml'
      - 'android-private/app/build.gradle'
      - 'android-private/app/src/androidTest/**'
      - 'android-private/app/src/main/java/jp/valuehunter/privatewatch/JpxCloseTable.java'
      - 'android-private/app/src/main/java/jp/valuehunter/privatewatch/JpxAndroidPdfReader.java'
      - 'android-private/tools/jpx_daily_probe.py'

permissions:
  contents: read

jobs:
  pdf-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - name: Build APKs for the private emulator run
        working-directory: android-private
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Fetch reference PDFs from JPX
        run: |
          curl -fsSL --retry 2 --max-time 45 https://www.jpx.co.jp/automation/markets/statistics-equities/daily/files/202610/stq_20261029.pdf -o "$RUNNER_TEMP/jpx-20261029.pdf"
          curl -fsSL --retry 2 --max-time 45 https://www.jpx.co.jp/automation/markets/statistics-equities/daily/files/202611/stq_20261116.pdf -o "$RUNNER_TEMP/jpx-20261116.pdf"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build independent references for Android's PDF extraction
        env:
          PYTHONPATH: android-private/tools
        run: |
          python -m pip install 'PyMuPDF>=1.24,<2' 'openpyxl>=3.1,<4'
          python - <<'PY'
          from hashlib import sha256
          import os
          from pathlib import Path
          import re
          from urllib.parse import urljoin, urlsplit
          from urllib.request import urlopen

          from jpx_daily_probe import ordinary_stocks, read_quotes

          scratch = Path(os.environ["RUNNER_TEMP"])
          index = "https://www.jpx.co.jp/markets/statistics-equities/misc/01.html"
          with urlopen(index, timeout=30) as response:
              links = re.findall(r'href=["\']([^"\']+/data_j\.xlsx)["\']', response.read().decode(), re.I)
          source, = {urljoin(index, link) for link in links}
          if urlsplit(source).netloc != "www.jpx.co.jp" or urlsplit(source).scheme != "https":
              raise ValueError("Unexpected JPX code master URL")
          master = scratch / "jpx-list.xlsx"
          with urlopen(source, timeout=30) as response:
              master.write_bytes(response.read())
          stocks = ordinary_stocks(master)
          (scratch / "jpx-codes.txt").write_text("\n".join(sorted(stocks)) + "\n")
          def display(value):
              return "" if value is None else format(value.normalize(), "f")
          with (scratch / "jpx-expected.txt").open("w") as expected:
              for pdf in sorted(scratch.glob("jpx-*.pdf")):
                  prices, conflicts = read_quotes(pdf, stocks)
                  rows = [f"{code}\t{display(am)}\t{display(pm)}\n"
                          for code, (am, pm) in sorted(prices.items())]
                  rows.extend(f"{code}\tconflict\n" for code in sorted(conflicts))
                  digest = sha256("".join(rows).encode()).hexdigest()
                  closes = sum(am is not None or pm is not None for am, pm in prices.values())
                  print(f"JPX_ANDROID_CLOSES {pdf.name} {len(prices)} {closes} {digest}", file=expected)
          PY
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Android's PDF engine on official JPX reports
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install android-private/app/build/outputs/apk/debug/app-debug.apk
            adb install android-private/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell -T "run-as jp.valuehunter.privatewatch sh -c 'cat > jpx-20261029.pdf'" < "$RUNNER_TEMP/jpx-20261029.pdf"
            adb shell -T "run-as jp.valuehunter.privatewatch sh -c 'cat > jpx-20261116.pdf'" < "$RUNNER_TEMP/jpx-20261116.pdf"
            adb shell -T "run-as jp.valuehunter.privatewatch sh -c 'cat > jpx-codes.txt'" < "$RUNNER_TEMP/jpx-codes.txt"
            adb shell am instrument -w jp.valuehunter.privatewatch.test/jp.valuehunter.privatewatch.JpxPdfGeometryProbe | tee "$RUNNER_TEMP/jpx-android-probe.log"
            grep '^JPX_ANDROID_CLOSES ' "$RUNNER_TEMP/jpx-android-probe.log" | tr -d '\r' > "$RUNNER_TEMP/jpx-actual.txt"
            diff -u "$RUNNER_TEMP/jpx-expected.txt" "$RUNNER_TEMP/jpx-actual.txt"
