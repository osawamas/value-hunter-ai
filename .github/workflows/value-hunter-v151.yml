name: VALUE HUNTER v151 OCBC original bank table line discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/sgx_ocbc_text_context_v151.py'
      - 'SGX_PDF_connection_probe/test_sgx_ocbc_text_context_v151.py'
      - '.github/workflows/value-hunter-v151.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v151
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test original-PDF hash guards
        run: |
          python -m pip install --quiet 'pymupdf>=1.24,<1.28'
          cd SGX_PDF_connection_probe
          python -m unittest -v test_sgx_ocbc_text_context_v151
      - name: Extract bounded text context from genuine SGX press release
        run: |
          python SGX_PDF_connection_probe/sgx_ocbc_text_context_v151.py --manifest docs/data/sgx-ocbc-2026q3-pdfs-v145.json --output docs/data/sgx-ocbc-text-context-v151.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/data/sgx-ocbc-text-context-v151.json').read_text())
          assert d['status']=='SGX_OCBC_ORIGINAL_TEXT_CONTEXTS_EXTRACTED',d['error']
          assert d['record']['extracted_precise_bank_accounting_values_verified'] is False
          f=json.loads(Path('docs/data/latest.json').read_text())
          assert f['ranking_eligible_count']==0
          PY
      - name: Save bounded original PDF context to main with retry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python SGX_PDF_connection_probe/sgx_ocbc_text_context_v151.py --manifest docs/data/sgx-ocbc-2026q3-pdfs-v145.json --output docs/data/sgx-ocbc-text-context-v151.json
            git add docs/data/sgx-ocbc-text-context-v151.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(v151): OCBC actual SGX bank table text contexts'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
