name: VALUE HUNTER v144 OCBC official attachment URL discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/sgx_ocbc_q3_attachments_v144.py'
      - 'SGX_PDF_connection_probe/test_sgx_ocbc_q3_attachments_v144.py'
      - '.github/workflows/value-hunter-v144.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v144
  cancel-in-progress: false
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact SGX URL resolution
        run: |
          cd SGX_PDF_connection_probe
          python -m unittest -v test_sgx_ocbc_q3_attachments_v144
      - name: Read OCBC 3Q real announcement attachment hrefs
        run: |
          python SGX_PDF_connection_probe/sgx_ocbc_q3_attachments_v144.py --manifest docs/data/sgx-ocbc-2026q3-manifest-v143.json --output docs/data/sgx-ocbc-2026q3-links-v144.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("docs/data/sgx-ocbc-2026q3-links-v144.json").read_text())
          if x["record"]:
           assert x["record"]["downloaded_original_pdfs"] is False
           assert x["record"]["ranking_eligible"] is False
          f=json.loads(Path("docs/data/latest.json").read_text())
          assert f["ranking_eligible_count"]==0
          print(x["status"],x["error"])
          PY
      - name: Save official attachment provenance safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python SGX_PDF_connection_probe/sgx_ocbc_q3_attachments_v144.py --manifest docs/data/sgx-ocbc-2026q3-manifest-v143.json --output docs/data/sgx-ocbc-2026q3-links-v144.json
            git add docs/data/sgx-ocbc-2026q3-links-v144.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(v144): authentic OCBC Q3 attachment URLs if available'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
