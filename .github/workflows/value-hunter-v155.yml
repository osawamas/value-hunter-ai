name: VALUE HUNTER v155 OCBC exact income components UI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/ocbc-income-v155.js'
      - 'docs/test_ocbc_income_v155.js'
      - '.github/workflows/value-hunter-v155.yml'
permissions:
  contents: read
jobs:
  bank-income-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run bank-only income and prior earnings regression
        run: |
          node --check docs/ocbc-income-v155.js
          node docs/test_ocbc_income_v155.js
          node docs/test_ocbc_exact_profit_v153.js
          node docs/test_ocbc_bank_ratios_v150.js
      - name: Verify actual issuer tables and zero ranking
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const {validate}=require('./docs/ocbc-income-v155.js');
          const f=JSON.parse(fs.readFileSync('docs/data/latest.json','utf8'));
          const c=JSON.parse(fs.readFileSync('docs/data/sgx-ocbc-income-components-v154.json','utf8'));
          const p=JSON.parse(fs.readFileSync('docs/data/sgx-ocbc-exact-profit-v152.json','utf8'));
          const rows=validate(f,c,p);
          assert.equal(rows.length,2);
          assert.equal(rows[0].combined_interest_and_noninterest_income,3733);
          assert.equal(rows[1].combined_interest_and_noninterest_income,11731);
          assert.equal(f.ranking_eligible_count,0);
          console.log('OCBC official original income table displayed with no PER/PBR certification');
          JS
