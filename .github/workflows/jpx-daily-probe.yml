name: JPX daily ordinary-stock extraction trial

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jpx-daily-probe.yml'
      - 'android-private/tools/jpx_daily_probe.py'
      - 'android-private/tools/check_jpx_java_quotes.py'
      - 'android-private/tools/JpxCloseTableCheck.java'
      - 'android-private/app/src/main/java/jp/valuehunter/privatewatch/JpxCloseTable.java'
      - 'android-private/tools/jpx_daily_sources.py'
      - 'android-private/tools/jpx_valuation_probe.py'
      - 'android-private/tools/jpx_hachiquant_coverage.py'
      - 'android-private/tools/jpx_share_basis.py'
      - 'android-private/tools/jpx_rights_sources.py'
      - 'android-private/tools/jpx_daily_rights.py'
      - 'android-private/tools/test_jpx_rights_sources.py'
      - 'android-private/tools/fixtures/jpx-annual-reference.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyMuPDF>=1.24,<2' 'openpyxl>=3.1,<4' 'xlrd>=2,<3'
      - name: Check JPX source selection and edition conflict handling
        run: python -m unittest discover -s android-private/tools -p 'test_jpx_rights_sources.py' -v
      - name: Compare two published JPX reports with the exchange symbol list
        run: |
          master_page=https://www.jpx.co.jp/markets/statistics-equities/misc/01.html
          curl -fsSL --max-time 45 "$master_page" -o "$RUNNER_TEMP/jpx-master.html"
          master_url=$(python - "$master_page" "$RUNNER_TEMP/jpx-master.html" <<'PY'
          import re
          import sys
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit

          links = re.findall(r'href=["\']([^"\']+/data_j\.xlsx)["\']',
                             Path(sys.argv[2]).read_text(encoding="utf-8"), re.I)
          urls = {urljoin(sys.argv[1], link) for link in links}
          url, = urls
          if urlsplit(url).netloc != "www.jpx.co.jp" or urlsplit(url).scheme != "https":
              raise SystemExit("Unexpected JPX symbol list link")
          print(url)
          PY
          )
          curl -fsSL --max-time 45 "$master_url" -o "$RUNNER_TEMP/jpx-list.xlsx"
          curl -fsSL --max-time 45 https://www.jpx.co.jp/automation/markets/statistics-equities/daily/files/202610/stq_20261029.pdf -o "$RUNNER_TEMP/jpx-20261029.pdf"
          curl -fsSL --max-time 45 https://www.jpx.co.jp/automation/markets/statistics-equities/daily/files/202611/stq_20261111.pdf -o "$RUNNER_TEMP/jpx-20261111.pdf"
          python android-private/tools/jpx_daily_probe.py "$RUNNER_TEMP/jpx-20261029.pdf" "$RUNNER_TEMP/jpx-list.xlsx" --check 1301 4475 --check 8894 15 --check 1401 1386
          python android-private/tools/jpx_daily_probe.py "$RUNNER_TEMP/jpx-20261111.pdf" "$RUNNER_TEMP/jpx-list.xlsx"
      - name: Verify a source-checked annual valuation against two official JPX reports
        run: |
          for day in 20261029 20261111; do
            python android-private/tools/jpx_valuation_probe.py "$RUNNER_TEMP/jpx-$day.pdf" "$RUNNER_TEMP/jpx-list.xlsx" android-private/tools/fixtures/jpx-annual-reference.json > "$RUNNER_TEMP/valuations-$day.json"
          done
          python - "$RUNNER_TEMP" <<'PY'
          from datetime import date
          from decimal import Decimal
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "android-private/tools")
          from jpx_valuation_probe import associate, load_financials

          fixture = load_financials("android-private/tools/fixtures/jpx-annual-reference.json")
          report_dir = Path(sys.argv[1])
          for day in ("2026-10-29", "2026-11-11"):
              result = json.loads((report_dir / f"valuations-{day.replace('-', '')}.json").read_text())
              assert result["trading_date"] == day
              assert result["valuation_kind"] == "annual_reference_only"
              item = result["results"]["1301"]
              assert item["status"] == "annual_reference"
              assert item["annual_period_end"] == "2026-03-31"
              assert item["disclosed_on"] == "2026-05-15"
              assert Decimal(item["annual_reference_per"]) > 0
              assert Decimal(item["annual_reference_pbr"]) > 0
              assert sum(v["status"] == "annual_reference" for v in result["results"].values()) == 1
              if day == "2026-10-29":
                  assert Decimal(item["close_jpy"]) == Decimal("4475")
                  assert item["close_session"] == "afternoon"
                  assert item["annual_reference_per"] == "7.7688"
                  assert item["annual_reference_pbr"] == "0.6873"

          # Date-only disclosures on the quote date cannot be safely assumed to pre-date the close.
          quotes = {"1301": (Decimal("10"), None)}
          stocks = {"1301": "prime"}
          assert associate(date(2026, 5, 15), stocks, quotes, set(), fixture)["1301"]["status"] == "financials_not_yet_public"
          assert associate(date(2026, 5, 16), stocks, quotes, set(), fixture)["1301"]["close_session"] == "morning"
          assert associate(date(2026, 5, 16), stocks, quotes, {"1301"}, fixture)["1301"]["status"] == "ambiguous_close"
          print("JPX closing prices and source-checked annual earnings/book value matched on two dates.")
          PY

      - name: Check split and consolidation rows against official JPX monthly reports
        working-directory: android-private/tools
        run: |
          curl -fsSL --max-time 30 https://www.jpx.co.jp/markets/statistics-equities/monthly/t13vrt0000013821-att/17_kenri2603.pdf -o "$RUNNER_TEMP/jpx-rights-202603.pdf"
          curl -fsSL --max-time 30 https://www.jpx.co.jp/markets/statistics-equities/monthly/t13vrt000000nwgb-att/17_kenri2601.pdf -o "$RUNNER_TEMP/jpx-rights-202601.pdf"
          curl -fsSL --max-time 30 https://www.jpx.co.jp/markets/statistics-equities/monthly/um3qrc0000027wd5-att/17_kenri2509.pdf -o "$RUNNER_TEMP/jpx-rights-202509.pdf"
          curl -fsSL --max-time 30 https://www.jpx.co.jp/markets/statistics-equities/monthly/um3qrc0000023upu-att/17_kenri2508.pdf -o "$RUNNER_TEMP/jpx-rights-202508.pdf"
          python - "$RUNNER_TEMP/jpx-rights-202603.pdf" "$RUNNER_TEMP/jpx-rights-202601.pdf" "$RUNNER_TEMP/jpx-rights-202509.pdf" "$RUNNER_TEMP/jpx-rights-202508.pdf" <<'PY'
          from datetime import date
          from decimal import Decimal
          import sys
          from jpx_share_basis import ShareEvent, load_rights_reports, missing_rights_months, share_basis_status
          from jpx_daily_rights import DailyShareNotice, notice_kind

          march = date(2026, 3, 1)
          ex_on, record_on = date(2026, 3, 30), date(2026, 3, 31)
          rights = load_rights_reports([sys.argv[1]])
          months, events = rights
          assert months == {march}
          assert ShareEvent(ex_on, record_on, 1, 3) in events["8336"]
          assert ShareEvent(ex_on, record_on, 10, 1) in events["6731"]
          assert any(event.ratio_right == Decimal("1.05") for rows in events.values() for event in rows)
          assert any(event.ratio_right == Decimal("0.05") for rows in events.values() for event in rows)
          assert "6403" not in events  # Voting record date, no change in shares.
          assert share_basis_status("8336", march, date(2026, 3, 27), rights) == "no_share_change_in_supplied_reports"
          assert share_basis_status("8336", march, ex_on, rights) == "hold_share_basis_change"
          assert share_basis_status("6731", record_on, record_on, rights) == "hold_share_basis_change"
          assert share_basis_status("6403", march, date(2026, 4, 1), rights) == "hold_rights_report_gap"

          assert missing_rights_months(date(2025, 12, 31), date(2026, 4, 1), {march}) == (
              "2025-12", "2026-01", "2026-02", "2026-04",
          )

          # JPX's 2026-11-05 notice gives the 19th as the trading boundary for Keyence.
          nov = date(2026, 11, 1)
          keyence = ({nov}, {"6861": {ShareEvent(date(2026, 11, 19), date(2026, 11, 20), 1, 5)}})
          assert share_basis_status("6861", nov, date(2026, 11, 18), keyence) == "no_share_change_in_supplied_reports"
          assert share_basis_status("6861", nov, date(2026, 11, 19), keyence) == "hold_share_basis_change"
          notice = DailyShareNotice(date(2026, 11, 16), date(2026, 11, 19), date(2026, 11, 20), "split_or_ex_new_shares", "")
          assert notice_kind("配当") is None
          assert notice_kind("株式併合") == "consolidation"
          assert share_basis_status("6861", nov, date(2026, 11, 18), (set(), {}), [notice]) == "hold_rights_report_gap"
          assert share_basis_status("6861", nov, date(2026, 11, 19), (set(), {}), [notice]) == "hold_daily_share_notice"
          assert share_basis_status("6861", nov, date(2026, 11, 19), (set(), {}), []) == "hold_rights_report_gap"
          revised = DailyShareNotice(date(2026, 11, 18), date(2026, 11, 20), date(2026, 11, 20), notice.kind, "●")
          later_edition = DailyShareNotice(date(2026, 11, 20), revised.ex_on, revised.record_on, notice.kind, "●")
          assert share_basis_status("6861", nov, date(2026, 11, 19), (set(), {}), [notice, revised]) == "hold_daily_notice_conflict"
          assert share_basis_status("6861", nov, date(2026, 11, 19), (set(), {}), [notice, later_edition]) == "hold_daily_share_notice"
          other = DailyShareNotice(date(2026, 11, 16), date(2026, 11, 19), date(2026, 11, 20), notice_kind("その他"), "")
          assert share_basis_status("6861", nov, date(2026, 11, 19), (set(), {}), [other]) == "hold_daily_rights_unclassified"
          assert share_basis_status("6861", nov, date(2026, 11, 19), (set(), {}), [notice, other]) == "hold_daily_share_notice"
          print(f"Verified March 2026 split/consolidation report: {sum(map(len, events.values()))} events")

          january, september = date(2026, 1, 1), date(2025, 9, 1)
          rotated_months, rotated_events = load_rights_reports(sys.argv[2:4])
          assert rotated_months == {january, september}
          assert ShareEvent(date(2026, 1, 28), date(2026, 1, 29), 1, 3) in rotated_events["2323"]
          assert ShareEvent(date(2025, 9, 9), date(2025, 9, 10), 1, 2) in rotated_events["2726"]
          print(f"Verified January 2026 and September 2025 reports: {sum(map(len, rotated_events.values()))} events")

          august = date(2025, 8, 1)
          august_months, august_events = load_rights_reports([sys.argv[4]])
          assert august_months == {august}
          assert ShareEvent(date(2025, 8, 28), date(2025, 8, 31), 1, 2) in august_events["3399"]
          assert ShareEvent(date(2025, 8, 7), date(2025, 8, 10), Decimal("1.2"), 1) in august_events["9252"]
          print(f"Verified August 2025 report: {sum(map(len, august_events.values()))} events")
          PY

      - name: Validate monthly JPX reports and inspect the daily rights catalog
        run: |
          python android-private/tools/jpx_rights_sources.py \
            --year 2026 --start-month 2025-08 --cutoff-month 11 --output "$RUNNER_TEMP/jpx-rights"

      - name: Fetch and verify the latest JPX stock-price report
        run: |
          python android-private/tools/jpx_daily_sources.py "$RUNNER_TEMP/jpx-latest.pdf"
          python android-private/tools/jpx_daily_probe.py "$RUNNER_TEMP/jpx-latest.pdf" "$RUNNER_TEMP/jpx-list.xlsx"

      - name: Cross-check the Android Java quote matcher with the JPX reference
        run: |
          javac --release 17 -d "$RUNNER_TEMP/jpx-classes" \
            android-private/app/src/main/java/jp/valuehunter/privatewatch/JpxCloseTable.java \
            android-private/tools/JpxCloseTableCheck.java
          for report in "$RUNNER_TEMP/jpx-20261029.pdf" "$RUNNER_TEMP/jpx-latest.pdf"; do
            python android-private/tools/check_jpx_java_quotes.py "$report" \
              "$RUNNER_TEMP/jpx-list.xlsx" "$RUNNER_TEMP/jpx-classes"
          done

      - name: Measure JPX and Hachiquant coverage, with a budget-first filing sample
        run: |
          reports=()
          for report in "$RUNNER_TEMP"/jpx-rights/rights-*.pdf; do
            reports+=(--rights-report "$report")
          done
          for report in "$RUNNER_TEMP"/jpx-rights/*.xls; do
            if [[ -f "$report" ]]; then reports+=(--daily-rights "$report"); fi
          done
          python android-private/tools/jpx_hachiquant_coverage.py \
            "$RUNNER_TEMP/jpx-list.xlsx" "$RUNNER_TEMP/jpx-20261029.pdf" \
            "$RUNNER_TEMP/jpx-20261111.pdf" "$RUNNER_TEMP/jpx-latest.pdf" --check-filing 1301 --budget-samples-per-market 10 \
            "${reports[@]}"

  daily_notes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'PyMuPDF>=1.24,<2' 'openpyxl>=3.1,<4' 'xlrd>=2,<3'
      - name: Read the embedded JPX daily workbook guidance
        run: |
          python3 android-private/tools/jpx_rights_sources.py \
            --year 2026 --cutoff-month 11 --daily-only --output "$RUNNER_TEMP/jpx-daily-notes"
      - name: Inspect workbook objects rendered as text
        run: |
          if ! command -v libreoffice >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libreoffice-calc fonts-noto-cjk
          fi
          latest=$(find "$RUNNER_TEMP/jpx-daily-notes" -name '*.xls' | sort | tail -n1)
          test -n "$latest"
          libreoffice --headless --convert-to 'pdf:calc_pdf_Export:{"SinglePageSheets":{"type":"boolean","value":"true"}}' \
            --outdir "$RUNNER_TEMP/jpx-daily-notes" "$latest"
          python3 - "$RUNNER_TEMP/jpx-daily-notes" <<'PY'
          from pathlib import Path
          import sys
          import pymupdf

          pdf, = Path(sys.argv[1]).glob("*.pdf")
          with pymupdf.open(pdf) as document:
              print(f"Rendered workbook pages: {len(document)}")
              for page in document:
                  lines = page.get_text().splitlines()
                  if any("掲載ファイル利用時の留意点" in line for line in lines):
                      print("\n".join(lines))
          PY

  hachiquant:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the public financial API against the issuer's published values
        run: |
          curl -fsS --max-time 25 https://hachiquant.com/api/v1/companies/1301/metrics -o "$RUNNER_TEMP/kyokuyo-metrics.json"
          python3 - "$RUNNER_TEMP/kyokuyo-metrics.json" <<'PY'
          from decimal import Decimal
          import json
          from pathlib import Path
          import sys

          record, = json.loads(Path("android-private/tools/fixtures/jpx-annual-reference.json").read_text())
          metrics = json.loads(Path(sys.argv[1]).read_text(), parse_float=Decimal)
          annual, = [item for item in metrics if item.get("period_end") == record["period_end"]
                     and item.get("quarter") == 4 and item.get("currency") == "JPY"]
          assert annual["source_doc_id"] == "S100YE8K"
          assert annual["eps"] == Decimal(record["eps_jpy"])
          assert annual["bvps"] == Decimal(record["bps_jpy"])
          print("Keyless financial API: annual EPS and BPS matched the issuer report.")
          PY
