name: VALUE HUNTER user-ready ZIP browser verified v271
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-zip-browser-v270.yml'
      - 'docs/**'
      - 'scripts/e2e-sgx-browser-v268.mjs'
      - 'scripts/e2e-sgx-32-research-v296.mjs'
      - 'scripts/run-browser-regressions.sh'
permissions:
  contents: read
jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assemble standalone static web app ZIP
        run: |
          mkdir -p build/release-v270
          cat > START-HERE.txt <<'EOF'
          VALUE HUNTER AI / SGX投資分析画面 ローカルプレビュー
          
          使い方（Mac / Windows / Linux）
          1. ZIPを解凍する。
          2. ターミナル／コマンドプロンプトで、解凍したフォルダに移動する。
          3. Python 3があれば次のコマンドを実行する。
             python3 -m http.server 8765 --directory docs
             （Windowsなら py -3 -m http.server 8765 --directory docs でも可）
          4. Chromeで http://localhost:8765/ を開く。
          5. 停止するにはターミナルで Ctrl+C。
          
          重要：index.htmlを直接ダブルクリックしてfile://で開くと
          ブラウザのセキュリティ制限によりJSONデータが読み込めないことがある。
          HTTPサーバー経由で開いてほしい。
          
          このプレビューはSGX全銘柄ではない。現在の財務登録7社、
          過去の公式開示に根拠がある銘柄コード30件を表示する。
          SGXNet原本19件は本文・SHA256照合済み。
          正規のリアルタイム株価、投資ランキング、PER/PBRは未完成。
          ランキング適格0社のままで、投資助言ではない。
          出典の日付や検証状態を確認して利用すること。
          
          本番のGitHub Pages公開には所有者によるPages有効化が必要。
          EOF
          zip -q -r build/release-v270/value-hunter-ai-local-preview-v271.zip docs START-HERE.txt
          unzip -t build/release-v270/value-hunter-ai-local-preview-v271.zip | tail -n 2
          sha256sum build/release-v270/value-hunter-ai-local-preview-v271.zip | tee build/release-v270/zip-sha256.txt
          mkdir -p build/release-v270/unpacked
          unzip -q build/release-v270/value-hunter-ai-local-preview-v271.zip -d build/release-v270/unpacked
          test -s build/release-v270/unpacked/docs/index.html
          test -s build/release-v270/unpacked/docs/app.js
          test -s build/release-v270/unpacked/docs/sgx-historical-code-search-v258.js
          test -s build/release-v270/unpacked/docs/data/sgx-nineteen-original-html-sha-v262.json
          test -s build/release-v270/unpacked/docs/data/latest.json
          test -s build/release-v270/unpacked/docs/sgx-32-research.html
          test -s build/release-v270/unpacked/docs/sgx-32-research-v296.js
      - name: Start server from EXTRACTED distribution ZIP, not repository docs
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/release-v270/unpacked/docs > /tmp/value-hunter-zip-v270-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/value-hunter-zip-v270-http.log; exit 1
      - name: Control extracted ZIP in real Chromium
        run: |
          command -v google-chrome
          npm install --no-save --no-package-lock playwright-core
          VALUE_HUNTER_E2E_SCREENSHOT=build/release-v270/zip-mobile.png bash scripts/run-browser-regressions.sh
      - name: Save verified offline distribution and SHA256
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: value-hunter-local-preview-zip-v271
          path: |
            build/release-v270/value-hunter-ai-local-preview-v271.zip
            build/release-v270/zip-sha256.txt
            build/release-v270/zip-mobile.png
          if-no-files-found: error
          retention-days: 30
      - name: Save extracted-zip server diagnostic on failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: value-hunter-zip-debug-v270
          path: /tmp/value-hunter-zip-v270-http.log
          if-no-files-found: warn
          retention-days: 14
