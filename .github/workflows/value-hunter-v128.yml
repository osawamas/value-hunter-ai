name: VALUE HUNTER v128 S63 second site historical price corroboration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SGX_PDF_connection_probe/s63_eoddata_v128.py'
      - 'SGX_PDF_connection_probe/test_s63_eoddata_v128.py'
      - '.github/workflows/value-hunter-v128.yml'
permissions:
  contents: write
concurrency:
  group: value-hunter-v128
  cancel-in-progress: false
jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run price-source adversarial regression
        run: |
          cd SGX_PDF_connection_probe
          python -m unittest -v test_s63_eoddata_v128
      - name: Fetch historical S63 quote from second website
        run: |
          python SGX_PDF_connection_probe/s63_eoddata_v128.py --output docs/data/sgx-s63-second-site-v128.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("docs/data/sgx-s63-second-site-v128.json").read_text())
          assert r["schema_version"]=="sgx-s63-second-site-price-v128"
          if r["record"]:
            assert r["record"]["eligible_for_market_cap_per_pbr"] is False
            assert r["record"]["original_sgx_exchange_trade_tape_verified"] is False
            assert r["record"]["ranking_eligible"] is False
          f=json.loads(Path("docs/data/latest.json").read_text())
          assert f["ranking_eligible_count"]==0
          print(r["status"],r["error"])
          PY
      - name: Save research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/sgx-s63-second-site-v128.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(v128): separately hosted S63 historical price source diagnostics'
            git push
          fi
