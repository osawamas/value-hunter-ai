plugins {
    id 'com.android.application' version '8.7.3'
}

def privateAssets = layout.buildDirectory.dir('generated/privateAssets')
def historyPath = providers.gradleProperty('jpxHistoryFile').orNull
def usMonitorPath = providers.gradleProperty('usMonitorFile').orNull
def massiveKeyPath = providers.gradleProperty('massiveKeyFile').orNull
def syncPrivateAssets = tasks.register('syncPrivateAssets', Sync) {
    from(rootProject.file('../docs/data/android-s63-shares.json'))
    if (historyPath != null) {
        def historyFile = rootProject.file(historyPath)
        if (!historyFile.isFile()) {
            throw new GradleException('jpxHistoryFile must point to a local history JSON file')
        }
        from(historyFile) {
            rename { 'jpx-history.json' }
        }
    }
    if (massiveKeyPath != null) {
        def massiveKeyFile = rootProject.file(massiveKeyPath)
        if (!massiveKeyFile.isFile()) {
            throw new GradleException('massiveKeyFile must point to a local key file')
        }
        from(massiveKeyFile) {
            rename { 'massive-key.txt' }
        }
    }
    if (usMonitorPath != null) {
        def monitorFile = rootProject.file(usMonitorPath)
        if (!monitorFile.isFile()) {
            throw new GradleException('usMonitorFile must point to the generated local SEC ledger')
        }
        from(monitorFile) {
            rename { 'us-monitor-universe.json' }
        }
    }
    into(privateAssets)
}

// Reuse the actual bundled bronze emblem for the launcher icon instead
// of substituting a newly drawn lookalike. The image never leaves the APK.
def generatedBrandRes = layout.buildDirectory.dir('generated/brandRes')
def generateBrandIcon = tasks.register('generateBrandIcon') {
    def source = file('src/main/java/jp/valuehunter/privatewatch/BrandEmblem.java')
    inputs.file(source)
    outputs.dir(generatedBrandRes)
    doLast {
        def matcher = (source.getText('UTF-8') =~ /private static final String IMAGE = "([^"]+)"/)
        if (!matcher.find()) throw new GradleException('Canonical bronze emblem not found')
        def image = generatedBrandRes.get().file('drawable/launcher_exact.png').asFile
        image.parentFile.mkdirs()
        image.bytes = java.util.Base64.getDecoder().decode(matcher.group(1))
    }
}

android {
    sourceSets.main.assets.srcDir(privateAssets)
    sourceSets.main.res.srcDir(generatedBrandRes)
    namespace 'jp.valuehunter.privatewatch'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.valuehunter.privatewatch'
        minSdk 26
        targetSdk 34
        testInstrumentationRunner 'jp.valuehunter.privatewatch.JpxPdfGeometryProbe'
        versionCode 22
        versionName '0.6.16-test'
    }
    buildTypes {
        debug {
            // Temporary second diagnostic package: preserve both existing installations when CI debug signing changes.
            applicationIdSuffix '.diagnostic11'
            versionNameSuffix '-separate11'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure {
    dependsOn(syncPrivateAssets)
    dependsOn(generateBrandIcon)
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    androidTestImplementation 'androidx.work:work-testing:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
