plugins {
    id 'com.android.application' version '8.7.3'
}

def ledgerAssets = layout.buildDirectory.dir('generated/s63LedgerAssets')
def syncS63ShareLedger = tasks.register('syncS63ShareLedger', Sync) {
    from(rootProject.file('../docs/data/android-s63-shares.json'))
    into(ledgerAssets)
}

android {
    sourceSets.main.assets.srcDir(ledgerAssets)
    namespace 'jp.valuehunter.privatewatch'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.valuehunter.privatewatch'
        minSdk 26
        targetSdk 34
        testInstrumentationRunner 'jp.valuehunter.privatewatch.JpxPdfGeometryProbe'
        versionCode 4
        versionName '0.4'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure {
    dependsOn(syncS63ShareLedger)
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
    androidTestImplementation 'androidx.work:work-testing:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
