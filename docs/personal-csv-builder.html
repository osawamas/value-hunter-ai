<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>個人用CSV作成 | VALUE HUNTER AI</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:1rem;line-height:1.7}label{display:block;margin:.7rem 0}input,select,button{font:inherit;padding:.4rem}button{margin:.5rem}#status{white-space:pre-wrap}</style><a href="./market-research.html">← 3市場の銘柄調査</a><h1>個人用株価・株数CSVを作成</h1><p>自分で確認した終値と同日付の自己株式控除後株数を入力。外部送信・自動取得はしない。出典と利用条件は入力者が確認する。</p><label>市場 <select id="market"><option value="JP">日本（JPY）</option><option value="US">米国（USD）</option><option value="SG">シンガポール（SGD）</option></select></label><label>銘柄コード <input id="symbol" maxlength="12" placeholder="7203 / AAPL / S63"></label><label>取引日 <input id="date" type="date"></label><label>終値 <input id="close" type="text" inputmode="decimal"></label><label>自己株式控除後株数（不明なら空欄） <input id="shares" type="text" inputmode="numeric"></label><button id="add" type="button">行を追加</button><button id="clear" type="button">全行を消す</button><p id="status" role="status">まだ行はない。</p><button id="quotes" type="button" disabled>株価CSVを保存</button><button id="sharefile" type="button" disabled>株数CSVを保存</button><p>2つのCSVは調査画面に別々に読み込む。株数が空欄なら株数CSVには含まれない。異なる日付は自動で結合しない。</p><script>
"use strict";
const $=id=>document.getElementById(id),rows=[],currencies={JP:"JPY",US:"USD",SG:"SGD"};
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+"T00:00:00Z");return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===s;}
function refresh(){const n=rows.filter(r=>r.shares).length;$("status").textContent=rows.length+"行の終値、"+n+"行の株数。\n"+rows.map(r=>r.id+" / "+r.date+" / "+r.currency+" "+r.close+" / 株数 "+(r.shares||"未入力")).join("\n");$("quotes").disabled=!rows.length;$("sharefile").disabled=!n;}
$("add").onclick=()=>{const market=$("market").value,symbol=$("symbol").value.trim().toUpperCase(),date=$("date").value,close=$("close").value.trim(),shares=$("shares").value.trim(),id=market+":"+symbol;
if(!/^[A-Z0-9.-]{1,12}$/.test(symbol)||!validDate(date)||!/^\d+(\.\d+)?$/.test(close)||!Number.isFinite(Number(close))||Number(close)<=0||(shares!==""&&(!/^\d+$/.test(shares)||!Number.isSafeInteger(Number(shares))||Number(shares)<=0))){$("status").textContent="コード・日付・終値・株数の形式を確認して。";return;}
if(rows.some(r=>r.id===id&&r.date===date)){$("status").textContent="同じ銘柄・日付は重複登録できない。";return;}
rows.push({id,date,currency:currencies[market],close,shares});refresh();};
$("clear").onclick=()=>{rows.length=0;refresh();};
function save(name,header,lines){const blob=new Blob(["\uFEFF"+header+"\r\n"+lines.join("\r\n")+"\r\n"],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$("quotes").onclick=()=>save("value-hunter-personal-quotes.csv","market_id,date,currency,close",rows.map(r=>[r.id,r.date,r.currency,r.close].join(",")));
$("sharefile").onclick=()=>save("value-hunter-personal-shares.csv","market_id,date,shares_excluding_treasury",rows.filter(r=>r.shares).map(r=>[r.id,r.date,r.shares].join(",")));
</script></html>
